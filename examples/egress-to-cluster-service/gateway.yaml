# The egress gateway stand-in: an HTTP server behind a ClusterIP Service, in a
# namespace of its own so the policy's reference has a namespace to name.
apiVersion: v1
kind: Namespace
metadata:
  name: egress-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-gateway
  namespace: egress-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: egress-gateway
  template:
    metadata:
      labels:
        app: egress-gateway
    spec:
      containers:
      - name: httpd
        image: busybox:1.36
        command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && httpd -f -p 8080 -h /www"]
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 1
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: egress-gateway
  namespace: egress-gateway
spec:
  selector:
    app: egress-gateway
  ports:
  - port: 8080
    targetPort: 8080
