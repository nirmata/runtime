apiVersion: v1
kind: Pod
metadata:
  name: mcp-client
  labels:
    app: mcp-client
spec:
  containers:
  - name: client
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      mkdir -p /root/.cursor
      printf '{"mcpServers":{}}' > /root/.cursor/mcp.json
      printf '[user]\n' > /root/.gitconfig
      sleep 900
