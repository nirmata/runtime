# The control: the same HTTP server, with no Service in front of it and no
# mention in the policy. It serves the same content from a different address, so
# the only difference between "reachable" and "not reachable" is the eBPF map
# state.
apiVersion: v1
kind: Pod
metadata:
  name: unlisted-target
  labels:
    app: unlisted-target
spec:
  containers:
  - name: httpd
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && httpd -f -p 8080 -h /www"]
    ports:
    - containerPort: 8080
    readinessProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 1
      periodSeconds: 2
