apiVersion: v1
kind: Pod
metadata:
  name: combined-allowed-backend
  labels:
    app: combined-allowed
spec:
  containers:
  - name: server
    image: nginx:1.27-alpine
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: combined-allowed
spec:
  selector:
    app: combined-allowed
  ports:
  - port: 80
    targetPort: 80
---
