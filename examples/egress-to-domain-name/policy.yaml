# The allowed destination is a name in the default namespace, so the manifests
# alongside this file must be applied there for the name to resolve.
apiVersion: runtime.nirmata.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: egress-to-domain-name
spec:
  mode: enforce
  podSelector:
    matchLabels:
      app: dns-client
  behaviors:
  - network:
      deny:
        values:
        - "*"
      allow:
        values:
        - dns-target-allowed.default.svc.cluster.local
        serviceRefs:
        - name: kube-dns
          namespace: kube-system
