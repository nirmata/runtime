apiVersion: v1
kind: Pod
metadata:
  name: trusted-agent
  labels:
    nirmata.io/agent: trusted
spec:
  containers:
  - name: agent
    image: curlimages/curl:8.10.1
    command: ["sh", "-c", "sleep 900"]
---
apiVersion: v1
kind: Pod
metadata:
  name: untrusted-agent
  labels:
    nirmata.io/agent: untrusted
spec:
  containers:
  - name: agent
    image: curlimages/curl:8.10.1
    command: ["sh", "-c", "sleep 900"]
