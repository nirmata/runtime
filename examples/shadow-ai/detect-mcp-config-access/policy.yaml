apiVersion: runtime.nirmata.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: detect-mcp-config-access
spec:
  mode: monitor
  podSelector:
    matchLabels:
      app: mcp-client
  behaviors:
  - open:
      deny:
        values:
        # One absolute path per (home directory, config file) pair: a directory
        # rule would report every file below it, and no other glob exists.
        - /root/.cursor/mcp.json
        - /root/.codeium/windsurf/mcp_config.json
        - /root/.config/Claude/claude_desktop_config.json
        - /home/node/.cursor/mcp.json
        - /home/node/.codeium/windsurf/mcp_config.json
        - /home/node/.config/Claude/claude_desktop_config.json
        - /etc/mcp/config.json
