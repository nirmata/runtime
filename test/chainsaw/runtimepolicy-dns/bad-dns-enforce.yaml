# spec.mode: enforce together with a dns behavior. The RuntimePolicySpec
# XValidation rule refuses it: destinations are enforced by a network behavior's
# domain values, so accepting this would give an author two spellings of one
# thing with only one of them working.
#
# podSelector is set so the dns rule is the only rule this document violates.
apiVersion: runtime.nirmata.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: chainsaw-dns-enforce-mode
spec:
  mode: enforce
  podSelector: {}
  behaviors:
  - dns:
      allow:
        values:
        - api.openai.com