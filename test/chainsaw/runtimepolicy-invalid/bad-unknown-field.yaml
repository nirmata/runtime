# Invalid under strict validation: namespaceSelector is not part of
# RuntimePolicySpec (it belonged to a removed schema). Pruning would drop it
# silently; strict client-side/server-side validation must reject it.
apiVersion: runtime.nirmata.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: chainsaw-invalid-unknown-field
spec:
  mode: enforce
  namespaceSelector:
    matchLabels:
      runtime-monitor: enabled
  behaviors:
  - open:
      deny:
        values:
        - /etc/shadow
