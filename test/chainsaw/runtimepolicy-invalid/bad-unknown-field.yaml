# Invalid under strict validation: workloadSelector is not part of
# RuntimePolicySpec. Pruning would drop it silently; strict client-side/server-side
# validation must reject it.
apiVersion: runtime.nirmata.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: chainsaw-invalid-unknown-field
spec:
  mode: enforce
  workloadSelector:
    matchLabels:
      runtime-monitor: enabled
  behaviors:
  - open:
      deny:
        values:
        - /etc/shadow
