# Two identical HTTP servers, reachable by address and by whatever name the stub
# resolver answers with their addresses. No Service fronts them: a name in the
# cluster DNS domain resolves from the API server instead of from the pod's own
# DNS answers, which is the opposite of what this suite exercises.
apiVersion: v1
kind: Pod
metadata:
  name: dns-allowed-backend
  labels:
    app: dns-allowed-backend
spec:
  containers:
  - name: httpd
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && httpd -f -p 8080 -h /www"]
    ports:
    - containerPort: 8080
    readinessProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 1
      periodSeconds: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: dns-denied-backend
  labels:
    app: dns-denied-backend
spec:
  containers:
  - name: httpd
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && httpd -f -p 8080 -h /www"]
    ports:
    - containerPort: 8080
    readinessProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 1
      periodSeconds: 2
