# Template applied by chainsaw-test.yaml after substituting TEST_NAMESPACE with
# the ephemeral test namespace (chainsaw does not do partial string
# interpolation, so the substitution happens in a script step -- keeping the
# policy shape reviewable as YAML rather than buried in a heredoc).
#
# Default-deny egress with exactly one allowed destination named as a fully
# qualified domain name. The kube-dns reference is not incidental: under
# default-deny a client that cannot reach the resolver resolves nothing, the
# snooper sees no answer, and every arm of the test would report "blocked" for
# the wrong reason.
apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: e2e-egress-dns
spec:
  mode: enforce
  podSelector:
    matchLabels:
      app: dns-client
  behaviors:
  - network:
      allow:
        values:
        - dns-allowed.TEST_NAMESPACE.svc.cluster.local
        serviceRefs:
        - name: kube-dns
          namespace: kube-system
      deny:
        values:
        - "*"
