# A second client, started after the policy, that has never looked anything up.
# Each pod loads its own map set, so this pod's ip_domain is empty and the
# allowed Service's address means nothing to it until it resolves the name.
apiVersion: v1
kind: Pod
metadata:
  name: dns-probe
  labels:
    app: dns-client
spec:
  containers:
  - name: client
    image: busybox:1.36
    command: ["sh", "-c", "sleep 900"]
