# STUB_RESOLVER_IP is the dns-stub Service's ClusterIP, substituted by
# chainsaw-test.yaml: dnsConfig takes an address, and the Service does not have
# one until it is created.
#
# dnsPolicy None sends every lookup this pod makes to the stub instead of to
# cluster DNS, so the answers the snooper reads are the ones the test wrote.
apiVersion: v1
kind: Pod
metadata:
  name: dns-client
  labels:
    app: dns-client
spec:
  dnsPolicy: None
  dnsConfig:
    nameservers:
    - STUB_RESOLVER_IP
  containers:
  - name: client
    image: busybox:1.36
    command: ["sh", "-c", "sleep 900"]
