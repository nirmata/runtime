# Chainsaw configuration for the cluster e2e suite.
#
# Unlike test/chainsaw (schema-only), these tests need the chart INSTALLED into a
# kind cluster (`make kind-install`) and, for the behavioral ones, a Linux kernel
# the daemon's eBPF programs can actually load into.
#
# Suite layout:
#   install-gate/   -- a GATE, not a behavioral assertion: image builds, chart
#                      installs, daemonset reaches Ready, policies are accepted
#                      and the daemon does not crash. Proves nothing about eBPF.
#   egress-enforce/ -- a real behavioral assertion: cgroup egress allow/deny.
#                      Needs cgroup v2 + BPF; does NOT need BPF-LSM.
#   egress-svcref/  -- the same, for targets named as in-cluster Services.
#   egress-dns/     -- the same, for targets named as domains: the cgroup DNS
#                      snooper feeding the egress filter. Brings its own resolver,
#                      so it needs neither cluster DNS nor the internet.
#   egress-overlap/ -- two policies over one pod, and a pod that starts after the
#                      policies selecting it.
#   protocol-enforce/ -- behavioral assertion for the application-protocol
#                      classifier: per-protocol verdicts on one destination
#                      and port. Same kernel requirements as egress-enforce.
#   dispatch-only/  -- excluded from the default run. Requires `lsm=bpf` in
#                      /sys/kernel/security/lsm, which GitHub hosted runners do
#                      not have (issue #60). Run via the workflow_dispatch lane
#                      or `make test-e2e-lsm` on a suitably booted host.
#
# Run with: make test-e2e (excludes dispatch-only) / make test-e2e-lsm
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Configuration
metadata:
  name: kyverno-runtime-e2e
spec:
  timeouts:
    apply: 60s
    assert: 180s
    delete: 90s
    cleanup: 90s
    exec: 120s
  failFast: false
  # Every fixture in these suites is a sleep loop or a one-shot server with
  # nothing to drain, so the default 30s grace period is wall clock and nothing
  # else -- and it is spent per pod, after the assertions have already passed.
  forceTerminationGracePeriod: 1s
