apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: runtimepolicy-cluster-scope
spec:
  timeouts:
    apply: 30s
    assert: 180s
    cleanup: 60s
  steps:
  - name: assert-runtimepolicy-crd-scope
    try:
    - assert:
        resource:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: runtimepolicies.runtime.kyverno.io
          spec:
            scope: Cluster

  - name: setup-namespace
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: e2e-runtimepolicy-cluster
            labels:
              runtime-monitor: "enabled"

  - name: apply-cluster-runtimepolicy
    try:
    - apply:
        resource:
          apiVersion: runtime.kyverno.io/v1alpha1
          kind: RuntimePolicy
          metadata:
            name: e2e-cluster-open
          spec:
            namespaceSelector:
              matchLabels:
                runtime-monitor: "enabled"
            validations:
            - name: detect-open-activity
              event: open
              message: Open activity detected in cluster-scoped policy
              severity: high
              matchConditions:
              - expression: 'true'
              actions:
              - type: generate_report
                message: Cluster-scoped RuntimePolicy generated this finding

  - name: create-demo-pod
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: e2e-cluster-open-demo
            namespace: e2e-runtimepolicy-cluster
            labels:
              app: e2e-cluster-open-demo
          spec:
            restartPolicy: Never
            containers:
            - name: app
              image: busybox:1.36
              command: ["sh", "-c", "for i in $(seq 1 30); do cat /etc/hosts >/dev/null; sleep 0.1; done"]
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: e2e-cluster-open-demo
            namespace: e2e-runtimepolicy-cluster
          status:
            phase: Succeeded

  - name: assert-policy-report
    try:
    - assert:
        resource:
          apiVersion: wgpolicyk8s.io/v1alpha2
          kind: PolicyReport
          metadata:
            namespace: e2e-runtimepolicy-cluster
            labels:
              app.kubernetes.io/managed-by: kyverno-runtime
              runtime.kyverno.io/policy: e2e-cluster-open
          (results != null): true
          (length(results) > `0`): true

  - name: cleanup
    try:
    - delete:
        ref:
          apiVersion: v1
          kind: Pod
          name: e2e-cluster-open-demo
          namespace: e2e-runtimepolicy-cluster
    - delete:
        ref:
          apiVersion: runtime.kyverno.io/v1alpha1
          kind: RuntimePolicy
          name: e2e-cluster-open
    - delete:
        ref:
          apiVersion: v1
          kind: Namespace
          name: e2e-runtimepolicy-cluster
