# One plain-TCP HTTP server. The classifier runs on the CLIENT's first data
# segment, so this single listener serves every probe: busybox httpd answers
# real HTTP with 200 and any delivered garbage (an SSH banner, a raw TLS
# ClientHello) with 400. A delivered segment therefore always produces
# response bytes, and a classifier drop produces none -- same destination,
# same port for every protocol.
apiVersion: v1
kind: Pod
metadata:
  name: protocol-target
  labels:
    app: protocol-target
spec:
  containers:
  - name: httpd
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && httpd -f -p 8080 -h /www"]
    ports:
    - containerPort: 8080
    readinessProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 1
      periodSeconds: 2
