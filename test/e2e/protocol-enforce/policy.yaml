# Application-protocol default deny with two allowed protocols. Scoped by
# podSelector to the client pod only, so the target server and the daemon
# keep their networking.
apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: e2e-protocol-enforce
spec:
  mode: enforce
  podSelector:
    matchLabels:
      app: protocol-client
  behaviors:
  - protocol:
      allow:
        values:
        - "http1"
        - "tls/h2"
      deny:
        values:
        - "*"
        - "unknown"
