# E2E test: Verify that opening a sensitive file in a pod generates a PolicyReport.
#
# Prerequisites:
#   - kind cluster with kyverno-runtime installed (make kind-install)
#   - CRDs for RuntimePolicy and PolicyReport deployed
#
# This test:
#   1. Creates a namespace with runtime-monitor=enabled label
#   2. Applies a RuntimePolicy that detects /etc/hosts opens
#   3. Creates a pod that reads /etc/hosts
#   4. Asserts a PolicyReport is created with the expected finding
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: trace-open-sensitive-file
spec:
  timeouts:
    apply: 30s
    assert: 120s
    cleanup: 60s
  steps:
  # Step 1: Create namespace with runtime-monitor label
  - name: setup-namespace
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: e2e-trace-open
            labels:
              runtime-monitor: "enabled"

  # Step 2: Apply RuntimePolicy for detecting sensitive file opens
  - name: apply-runtime-policy
    try:
    - apply:
        resource:
          apiVersion: runtime.kyverno.io/v1alpha1
          kind: RuntimePolicy
          metadata:
            name: e2e-detect-sensitive-open
          spec:
            namespaceSelector:
              matchLabels:
                runtime-monitor: "enabled"
            validations:
            - name: detect-sensitive-open
              event: open
              message: Sensitive file open detected
              severity: high
              matchConditions:
              - expression: >-
                  ("fname" in event && event["fname"].contains("/etc/hosts")) ||
                  ("file.path" in event && event["file.path"].contains("/etc/hosts")) ||
                  ("path" in event && event["path"].contains("/etc/hosts")) ||
                  ("fullPath" in event && event["fullPath"].contains("/etc/hosts")) ||
                  ("filename" in event && event["filename"].contains("/etc/hosts"))
              actions:
              - type: generate_report
                message: Append a runtime finding to the PolicyReport audit log

  # Step 3: Create a pod that reads /etc/hosts
  - name: create-demo-pod
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: e2e-open-demo
            namespace: e2e-trace-open
            labels:
              app: e2e-open-demo
          spec:
            containers:
            - name: app
              image: busybox:1.36
              command: ["sh", "-c", "while true; do cat /etc/hosts; sleep 2; done"]
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: e2e-open-demo
            namespace: e2e-trace-open
          status:
            phase: Running

  # Step 4: Wait for PolicyReport to be created with findings
  - name: assert-policy-report
    try:
    - assert:
        resource:
          apiVersion: wgpolicyk8s.io/v1alpha2
          kind: PolicyReport
          metadata:
            namespace: e2e-trace-open
            labels:
              app.kubernetes.io/managed-by: kyverno-runtime
              runtime.kyverno.io/policy: e2e-detect-sensitive-open
          (scope != null): true
          (results != null): true
          (length(results) > `0`): true

  # Cleanup
  - name: cleanup
    try:
    - delete:
        ref:
          apiVersion: v1
          kind: Pod
          name: e2e-open-demo
          namespace: e2e-trace-open
    - delete:
        ref:
          apiVersion: runtime.kyverno.io/v1alpha1
          kind: RuntimePolicy
          name: e2e-detect-sensitive-open
    - delete:
        ref:
          apiVersion: v1
          kind: Namespace
          name: e2e-trace-open
