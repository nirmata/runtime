# E2E Tests for Default RuntimePolicy Library
# 
# This test file validates that the default policies installed via Helm
# work correctly end-to-end. Each policy is tested by:
# 1. Verifying the policy is installed in the cluster
# 2. Creating a test workload that triggers the policy
# 3. Asserting that a PolicyReport is generated with correct findings

---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: default-policies-installation
spec:
  description: Verify that all default policies are installed when enabled
  timeouts:
    apply: 30s
    assert: 60s
    delete: 60s
  steps:
  - name: verify-credential-access-policy
    try:
    - assert:
        resource:
          apiVersion: runtime.kyverno.io/v1alpha1
          kind: RuntimePolicy
          metadata:
            name: detect-credential-access
          (length(spec.validations) > `0`): true

  - name: verify-shell-execution-policy
    try:
    - assert:
        resource:
          apiVersion: runtime.kyverno.io/v1alpha1
          kind: RuntimePolicy
          metadata:
            name: detect-shell-execution
          (length(spec.validations) > `0`): true

  - name: verify-sensitive-file-access-policy
    try:
    - assert:
        resource:
          apiVersion: runtime.kyverno.io/v1alpha1
          kind: RuntimePolicy
          metadata:
            name: detect-sensitive-file-access
          (length(spec.validations) > `0`): true

  - name: verify-public-network-egress-policy
    try:
    - assert:
        resource:
          apiVersion: runtime.kyverno.io/v1alpha1
          kind: RuntimePolicy
          metadata:
            name: detect-public-network-egress
          (length(spec.validations) > `0`): true

  - name: verify-process-discovery-policy
    try:
    - assert:
        resource:
          apiVersion: runtime.kyverno.io/v1alpha1
          kind: RuntimePolicy
          metadata:
            name: detect-process-discovery
          (length(spec.validations) > `0`): true

  - name: verify-security-tool-disruption-policy
    try:
    - assert:
        resource:
          apiVersion: runtime.kyverno.io/v1alpha1
          kind: RuntimePolicy
          metadata:
            name: detect-security-tool-disruption
          (length(spec.validations) > `0`): true

  - name: verify-metadata-endpoint-egress-policy
    try:
    - assert:
        resource:
          apiVersion: runtime.kyverno.io/v1alpha1
          kind: RuntimePolicy
          metadata:
            name: detect-metadata-endpoint-egress
          (length(spec.validations) > `0`): true

---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: credential-access-detection
spec:
  description: Test credential access detection policy
  timeouts:
    apply: 30s
    assert: 120s
    delete: 90s
    cleanup: 60s
  steps:
  - name: setup-test-namespace
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: e2e-cred-access
            labels:
              app: test

  - name: create-test-pod-credential-access
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: cred-access-test
            namespace: e2e-cred-access
            labels:
              app: cred-access-test
          spec:
            restartPolicy: Never
            containers:
            - name: test
              image: busybox:1.36
              command: ["sh", "-c", "cat /etc/passwd && cat /etc/shadow 2>/dev/null; sleep 10"]
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: cred-access-test
            namespace: e2e-cred-access
          status:
            phase: Succeeded

  - name: verify-credential-access-report
    try:
    - assert:
        resource:
          apiVersion: wgpolicyk8s.io/v1alpha2
          kind: PolicyReport
          metadata:
            namespace: e2e-cred-access
            labels:
              app.kubernetes.io/managed-by: kyverno-runtime
          (results != null): true
          # At least one result for credential access
          (length(results) >= `1`): true

  - name: cleanup-credential-access-test
    try:
    - delete:
        ref:
          apiVersion: v1
          kind: Pod
          name: cred-access-test
          namespace: e2e-cred-access

