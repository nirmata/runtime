# E2E behavioral assertion -- open/exec enforcement.
#
# The assertions are on the enforcement outcome, not on the mechanism that
# reached it: the daemon uses BPF-LSM where the kernel was booted with `bpf` in
# the `lsm=` list and falls back to tracepoints where it was not, and a denied
# open must be refused either way.
#
# Both directions are asserted: a denied path/binary must be blocked AND an
# allowed one must still work, so a program that denies everything fails.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lsm-enforce
spec:
  steps:
  - name: apply-open-and-exec-deny-policy
    try:
    - apply:
        file: policy.yaml
    - assert:
        resource:
          apiVersion: runtime.nirmata.io/v1alpha1
          kind: RuntimePolicy
          metadata:
            name: e2e-lsm-enforce

  - name: denied-open-is-blocked-allowed-open-is-not
    try:
    - apply:
        file: client.yaml
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: lsm-client
          status:
            phase: Running
    - script:
        content: |
          set -eu

          # Positive control first: the allowed path must remain readable for the
          # whole test, otherwise "blocked" below proves nothing.
          ok=0
          for _ in $(seq 1 30); do
            if kubectl -n $NAMESPACE exec lsm-client -- cat /etc/hosts >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          [ "$ok" -eq 1 ] || { echo "FAIL: allowed open of /etc/hosts failed"; exit 1; }
          echo "OK: /etc/hosts readable"

          # Denied exec: must be refused (EPERM from bprm_check_security).
          if kubectl -n $NAMESPACE exec lsm-client -- /bin/nc -h >/dev/null 2>&1; then
            echo "FAIL: /bin/nc executed -- bprm_check_security enforcement not applied"
            exit 1
          fi
          echo "OK: /bin/nc exec blocked"

          # Denied path: must be refused (EPERM from the file_open LSM hook).
          blocked=0
          for _ in $(seq 1 30); do
            if kubectl -n $NAMESPACE exec lsm-client -- cat /etc/passwd >/dev/null 2>&1; then
              sleep 2
            else
              blocked=1; break
            fi
          done
          if [ "$blocked" -ne 1 ]; then
            echo "FAIL: /etc/passwd was readable -- file_open enforcement not applied"
            exit 1
          fi
          echo "OK: /etc/passwd blocked"

          # Allowed exec still works.
          kubectl -n $NAMESPACE exec lsm-client -- /bin/ls / >/dev/null
          echo "OK: /bin/ls exec allowed"