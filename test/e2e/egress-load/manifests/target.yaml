apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-load-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: egress-load-target
  template:
    metadata:
      labels:
        app: egress-load-target
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 1
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: egress-load-target
spec:
  selector:
    app: egress-load-target
  ports:
  - port: 80
    targetPort: 80
