version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam

  exclusions:
    paths:
      - \.claude/worktrees/
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unparam

formatters:
  enable:
    - gofmt
    - gci

  exclusions:
    paths:
      - \.claude/worktrees/

  settings:
    gofmt:
      simplify: true
    gci:
      custom-order: true
      sections:
        - standard
        - prefix(github.com/nirmata/kyverno-runtime)
        - default

