            type: string
          metadata:
            type: object
          spec:
            description: RuntimeRuleBindingSpec specifies how detection rules are
              applied to workloads.
            properties:
              anomalyDetection:
                description: AnomalyDetection controls anomaly detection behavior.
                properties:
                  baseline:
                    description: |-
                      Baseline selects which RuntimeBehavior resource to use for anomaly detection.
                      If omitted, uses the default RuntimeBehavior for the workload.
                    properties:
                      name:
                        description: Name of the RuntimeBehavior resource.
                        type: string
                      namespace:
