apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimeBehavior
metadata:
  name: demo-restrict-sensitive-files
  namespace: runtime-demo
spec:
  workloadSelector:
    matchLabels:
      app: demo
  mode: enforce
  allow:
    open:
      - /etc/hosts
      - /etc/resolv.conf
      - /etc/hostname
    deny:
      open:
        - /etc/shadow
        - /etc/gshadow
        - /etc/passwd-
        - /root/.ssh/id_rsa
        - /root/.aws/credentials
        - /var/run/secrets/kubernetes.io/serviceaccount/token
