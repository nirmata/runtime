apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: runtime-usecases-complete
spec:
  monitor:
    sampleRate: 1
    parameters:
      mode: audit
  validations:
  - name: block-external-db
    event: connect
    message: Unauthorized outbound DB traffic detected
    severity: high
    conditions:
    - expression: event["destination.ip"] != "10.0.0.1" && event["destination.ip"] != "10.0.0.2"
    - expression: event["destination.port"] == "5432" || event["destination.port"] == "3306"
    actions:
    - type: terminate
      message: Terminate pod on unauthorized DB connection
  - name: monitor-sensitive-file-access
    event: open
    message: Sensitive file access detected
    severity: high
    matchConditions:
    - expression: event["file.path"].contains("/etc/kubernetes/pki") || event["file.path"].contains("/var/run/secrets") || event["file.path"].endsWith(".pem") || event["file.path"].endsWith(".key") || event["file.path"].endsWith("id_rsa")
    actions:
    - type: log_event
      message: Record sensitive file access for audit
  - name: detect-shell-activity
    event: exec
    message: Shell execution in container
    severity: medium
    conditions:
    - expression: event["process.name"] == "/bin/sh" || event["process.name"] == "/bin/bash"
    actions:
    - type: kill_process
  - name: compliance-audit
    event: open
    message: Compliance audit event
    severity: info
    conditions:
    - expression: event["pod.labels.audit-enabled"] == "true"
    actions:
    - type: generate_report
  - name: detect-anomaly
    event: connect
    message: Behavioral anomaly detected
    severity: critical
    conditions:
    - expression: double(event["anomaly.baseline_deviation"]) > 3.0
    actions:
    - type: escalate_incident
  - name: monitor-performance
    event: tcpconnect
    message: Slow network behavior observed
    severity: medium
    conditions:
    - expression: double(event["latency"]) > 10000.0
    actions:
    - type: notify_ops
