# AI Agent Security Testing: Credential Access Scenario
# This scenario tests detection of AI agent workload attempting to read password files
# Simulates: AttackTechnique T1110 (Brute Force) via credential enumeration

apiVersion: v1
kind: Pod
metadata:
  name: ai-agent-cred-access
  namespace: default
  labels:
    app: ai-agent
    workload-type: ml-inference
spec:
  serviceAccountName: default
  containers:
  - name: ai-model
    image: python:3.11-slim
    command: ["python", "-c", "print('AI Agent Runtime')"]
    securityContext:
      runAsNonRoot: false
      allowPrivilegeEscalation: true
---
# RuntimeBehavior: Define expected AI agent behavior (learning phase)
apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimeBehavior
metadata:
  name: ai-agent-baseline
  namespace: default
spec:
  workloadSelector:
    matchLabels:
      app: ai-agent
  mode: monitor
  learning:
    duration: 2m
    minSamples: 10
    startAfter: ready
  allow:
    exec:
      - /usr/local/bin/python
      - /bin/sh
    open:
      - /usr/local/lib/python3.11
      - /etc/hostname
      - /etc/resolv.conf
---
# RuntimePolicy: Response to credential access attempts
apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: prevent-ai-credential-access
  namespace: default
spec:
  namespaceSelector:
    matchLabels:
      runtime-monitor: "enabled"
  validations:
    - name: detect-shadow-file-access
      event: open
      message: Attempt to access shadow password file detected
      severity: critical
      conditions:
        - name: shadow-pattern
          expression: event["file.path"] == "/etc/shadow" || event["file.path"] == "/etc/passwd"
      actions:
        - type: terminate
          message: Blocked password file access
    - name: detect-ssh-key-access
      event: open
      message: Attempt to access SSH keys detected
      severity: critical
      conditions:
        - name: ssh-key-pattern
          expression: contains(event["file.path"], "/.ssh/")
      actions:
        - type: alert
          message: SSH key access detected
    - name: detect-api-key-access
      event: open
      message: Attempt to access API credentials detected
      severity: warning
      conditions:
        - name: api-key-pattern
          expression: contains(event["file.path"], "/.aws/credentials") || contains(event["file.path"], "/.docker/config.json")
      actions:
        - type: alert
          message: API credential access detected
