# AI Agent Security Testing: Command & Control (C2) Communication Scenario
# This scenario tests detection of AI agent workload attempting C2 communication
# Simulates: AttackTechnique T1071 (Application Layer Protocol) + T1001 (Data Obfuscation)

apiVersion: v1
kind: Pod
metadata:
  name: ai-agent-c2-compromise
  namespace: default
  labels:
    app: ai-agent
    workload-type: ml-training
    environment: production
spec:
  serviceAccountName: default
  containers:
  - name: training-coordinator
    image: python:3.11-slim
    command: 
      - python
      - -c
      - |
        import socket
        import dns.resolver
        # Attempt to resolve C2 domains
        socket.gethostbyname('attacker.ngrok.io')
        socket.gethostbyname('my-tunnel.localtunnel.me')
    securityContext:
      runAsUser: 1000
---
# RuntimeBehavior: Strict DNS whitelist for training workloads
apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimeBehavior
metadata:
  name: ml-training-baseline
  namespace: default
spec:
  workloadSelector:
    matchLabels:
      app: ai-agent
      workload-type: ml-training
  mode: enforce
  learning:
    duration: 1m
    minSamples: 10
    startAfter: ready
  allow:
    dns:
      - internal-registry.example.com
      - ml-datasets.example.com
      - model-store.example.com
      - artifact-cache.example.com
  deny:
    dns:
      - "*.ngrok.io"
      - "*.localtunnel.me"
      - "*.duckdns.org"
      - pastebin.com
      - "*.github.io"
---
# RuntimePolicy: Prevent C2 communication and execution evasion
apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: prevent-ai-c2-communication
  namespace: default
spec:
  namespaceSelector:
    matchLabels:
      runtime-monitor: "enabled"
  validations:
    - name: detect-c2-ngrok
      event: open
      message: C2 communication to ngrok.io detected
      severity: critical
      conditions:
        - name: ngrok-pattern
          expression: contains(event["dns.query"], "ngrok.io")
      actions:
        - type: terminate
          message: Blocked ngrok C2 communication
    - name: detect-c2-tunnel
      event: open
      message: C2 communication to tunnel service detected
      severity: critical
      conditions:
        - name: tunnel-pattern
          expression: contains(event["dns.query"], "localtunnel.me") || contains(event["dns.query"], "duckdns.org")
      actions:
        - type: terminate
          message: Blocked tunnel C2 communication
    - name: detect-evasion-shell
      event: exec
      message: Suspicious shell execution detected
      severity: high
      conditions:
        - name: shell-pattern
          expression: event["process.name"] == "/bin/bash" || event["process.name"] == "/bin/sh"
      actions:
        - type: alert
          message: Shell execution detected
    - name: detect-evasion-tools
      event: exec
      message: Defense evasion tool execution detected
      severity: critical
      conditions:
        - name: evasion-pattern
          expression: event["process.name"] == "iptables" || event["process.name"] == "auditctl"
      actions:
        - type: terminate
          message: Blocked defense evasion attempt
