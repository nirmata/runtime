# AI Agent Security Testing: Credential Access Scenario
# This scenario tests detection of AI agent workload attempting to read password files
# Simulates: AttackTechnique T1110 (Brute Force) via credential enumeration

apiVersion: v1
kind: Pod
metadata:
  name: ai-agent-cred-access
  namespace: default
  labels:
    app: ai-agent
    workload-type: ml-inference
spec:
  serviceAccountName: default
  containers:
  - name: ai-model
    image: python:3.11-slim
    command: ["python", "-c", "print('AI Agent Runtime')"]
    securityContext:
      runAsNonRoot: false
      allowPrivilegeEscalation: true
---
# RuntimeBehavior: Define expected AI agent behavior (learning phase)
apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimeBehavior
metadata:
  name: ai-agent-baseline
  namespace: default
spec:
  workloadSelector:
    matchLabels:
      app: ai-agent
  mode: monitor
  learning:
    duration: 2m
    minSamples: 10
    startAfter: ready
  allow:
    exec:
      - /usr/local/bin/python
      - /bin/sh
    open:
      - /usr/local/lib/python3.11
      - /etc/hostname
      - /etc/resolv.conf
---
# RuntimeRuleBinding: Bind detection rules to this AI agent workload
apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimeRuleBinding
metadata:
  name: ai-agent-signature-detection
  namespace: default
spec:
  workloadSelector:
    matchLabels:
      app: ai-agent
  ruleSelection:
    include:
      - cred-access-*
      - exfil-*
      - defense-evasion-*
  signatureDetectionConfig:
    enabled: true
    rules:
      - cred-access-shadow
      - cred-access-ssh-key
      - cred-access-keys
      - defense-evasion-disable
  anomalyDetectionConfig:
    enabled: true
    minConfidence: 0.5
---
# RuntimePolicy: Response to credential access attempts
apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: prevent-ai-credential-access
  namespace: default
spec:
  workloadSelector:
    matchLabels:
      app: ai-agent
  rules:
    - name: block-shadow-file-access
      severity: critical
      patternMatchers:
        - pattern: "open"
          match: "/etc/shadow"
        - pattern: "open"
          match: "/etc/passwd"
      ruleAction: block
    - name: alert-ssh-key-access
      severity: critical
      patternMatchers:
        - pattern: "open"
          match: "/.ssh/"
      ruleAction: alert
    - name: monitor-api-key-access
      severity: warning
      patternMatchers:
        - pattern: "open"
          match: "/.aws/credentials"
        - pattern: "open"
          match: "/.docker/config.json"
      ruleAction: monitor
