apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: e2e-exec-cat
spec:
  namespaceSelector:
    matchLabels:
      runtime-monitor: "enabled"
  validations:
  - name: detect-cat-exec
    event: exec
    message: cat exec observed
    severity: high
    matchConditions:
    - expression: event["args"].contains("/bin/cat")
    actions:
    - type: generate_report
      message: runtime exec finding
