apiVersion: v1
kind: Pod
metadata:
  name: cap-netadmin
  namespace: runtime-e2e
  labels:
    app: cap-netadmin
    audit-enabled: "true"
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 600"]
    securityContext:
      capabilities:
        add: ["NET_ADMIN"]
