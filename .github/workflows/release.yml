name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  lint-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.11.4
          args: --help  # install only; actual run is via make lint

      - name: Verify formatting
        run: |
          make fmt
          git diff --exit-code || (echo "Formatting changes detected — run 'make fmt' locally" && exit 1)

      - name: Lint
        run: make lint

      - name: Lint docs
        run: make lint-docs

      - name: Build
        run: go build ./cmd/kyverno-runtime

      - name: Unit tests
        run: make test

  e2e-gate:
    name: E2E Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      KIND_CLUSTER_NAME: kyverno-runtime
      DOCKER_CONFIG: /tmp/.docker

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up ko
        uses: ko-build/setup-ko@d982fec422852203cfb2053a8ec6ad302280d04d # v0.8
        with:
          version: v0.17.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Set up kind
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}

      - name: Install Chainsaw
        shell: bash
        env:
          CHAINSAW_VERSION: v0.2.14
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in
            x86_64)
              arch="amd64"
              ;;
            arm64|aarch64)
              arch="arm64"
              ;;
            *)
              echo "Unsupported architecture: $arch"
              exit 1
              ;;
          esac

          mkdir -p "$HOME/.local/bin"
          url="https://github.com/kyverno/chainsaw/releases/download/${CHAINSAW_VERSION}/chainsaw_${os}_${arch}.tar.gz"
          curl -sSfL "$url" -o /tmp/chainsaw.tar.gz
          tar -xzf /tmp/chainsaw.tar.gz -C /tmp chainsaw
          install -m 0755 /tmp/chainsaw "$HOME/.local/bin/chainsaw"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/chainsaw" version

      - name: Build tagged image locally and run E2E
        shell: bash
        run: |
          set -euo pipefail
          make test-e2e-install IMAGE_REPOSITORY=ghcr.io/nirmata/kyverno-runtime IMAGE_TAG="${GITHUB_REF_NAME}"

      - name: Debug cluster state
        if: always()
        run: |
          echo "=== RuntimePolicies ===" && kubectl get runtimepolicies -o wide || true
          echo "=== Kyverno Runtime Pods ===" && kubectl -n kyverno-runtime get pods || true
          echo "=== Controller Logs ===" && kubectl -n kyverno-runtime logs -l app.kubernetes.io/name=kyverno-runtime --tail=50 || true
          echo "=== Events ===" && kubectl -n kyverno-runtime get events || true

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get reports -A || true
          kubectl -n kyverno-runtime get all || true
          kubectl -n kyverno-runtime logs -l app.kubernetes.io/name=kyverno-runtime --tail=200 || true

  publish-image:
    name: Build & Push Release Image
    runs-on: ubuntu-latest
    needs: [lint-test, e2e-gate]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up ko
        uses: ko-build/setup-ko@d982fec422852203cfb2053a8ec6ad302280d04d # v0.8
        with:
          version: v0.17.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        env:
          KO_DOCKER_REPO: ghcr.io/nirmata/kyverno-runtime
        run: |
          ko build ./cmd/kyverno-runtime \
            --push=true \
            --bare \
            --tags=${GITHUB_REF_NAME} \
            --platform=linux/amd64

  publish-chart:
    name: Package & Publish Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pages: write
    env:
      DOCKER_CONFIG: /tmp/.docker
    needs: [lint-test, e2e-gate]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Derive and validate chart version
        id: chart_version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$ ]]; then
            echo "Tag '$TAG' must match v<major>.<minor>.<patch> (optionally with prerelease/build suffix)."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set chart version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.chart_version.outputs.version }}"
          sed -i.bak -E "s/^version:.*/version: ${VERSION}/" charts/kyverno-runtime/Chart.yaml
          sed -i.bak -E "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/kyverno-runtime/Chart.yaml
          rm -f charts/kyverno-runtime/Chart.yaml.bak

      - name: Lint chart
        run: helm lint charts/kyverno-runtime

      - name: Package chart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cr-release-packages
          helm package charts/kyverno-runtime --destination .cr-release-packages

      - name: Push chart to GHCR (OCI)
        shell: bash
        run: |
          set -euo pipefail
          CHART_PACKAGE=".cr-release-packages/kyverno-runtime-${{ steps.chart_version.outputs.version }}.tgz"
          helm push "$CHART_PACKAGE" oci://ghcr.io/nirmata/kyverno-runtime

      - name: Configure Git for chart-releaser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
          # Store .tgz files in the gh-pages branch and serve them via GitHub Pages
          # (public) rather than as GitHub release assets (which require authentication
          # for private repos and cause "helm pull" to return 404).
          packages_with_index: true
          # Prevent overwriting the container-image release as "latest".
          mark_as_latest: false
          # Tolerate re-runs without failing on already-uploaded packages.
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}


