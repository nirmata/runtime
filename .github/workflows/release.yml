name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/nirmata/kyverno-runtime
  KIND_CLUSTER_NAME: kyverno-runtime
  CHAINSAW_VERSION: v0.2.15

jobs:
  # ---------------------------------------------------------------- ASSERTION
  #
  # Queries the nightly workflow's own run history instead of trusting a
  # status this workflow computes itself, so a red nightly actually blocks a
  # tag rather than just being documented as something that should. Fails
  # closed: no completed run on main is treated the same as a red one, because
  # neither tells us the enforcement path this release ships still works.
  nightly-gate:
    name: "Gate: most recent nightly run (BPF-LSM, egress load) is green"
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check the most recent nightly run on main
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?branch=main&status=completed&per_page=1" --jq '.workflow_runs[0]')"
          if [ -z "${run_json}" ] || [ "${run_json}" = "null" ]; then
            echo "No completed nightly run found on main. Run the Nightly workflow" \
                 "and confirm it is green before tagging a release."
            exit 1
          fi
          conclusion="$(echo "${run_json}" | jq -r '.conclusion')"
          html_url="$(echo "${run_json}" | jq -r '.html_url')"
          echo "most recent nightly run: ${html_url} (conclusion: ${conclusion})"
          if [ "${conclusion}" != "success" ]; then
            echo "Nightly is ${conclusion}. Fix it before tagging a release: ${html_url}"
            exit 1
          fi

  lint-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          args: --help  # install only; actual run is via make lint

      - name: Verify formatting
        run: |
          make fmt
          git diff --exit-code || (echo "Formatting changes detected — run 'make fmt' locally" && exit 1)

      - name: Lint
        run: make lint

      - name: Lint docs
        run: make lint-docs

      - name: CRD codegen drift
        run: make verify-crds

      - name: BPF object drift
        run: make verify-bpf

      - name: Build
        run: go build ./cmd/kyverno-runtime

      - name: Unit tests
        run: make test

  # A tag publishes a candidate first, proves it in a cluster, and only then wears the
  # release tag. Nothing consumes candidate-* except release-e2e and the weekly
  # ghcr-candidate-cleanup workflow, which prunes them.
  publish-candidate:
    name: Build & Push Candidate Image
    runs-on: ubuntu-latest
    needs: [lint-test, nightly-gate]
    outputs:
      candidate_tag: ${{ steps.candidate.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up ko
        uses: ko-build/setup-ko@d982fec422852203cfb2053a8ec6ad302280d04d # v0.8
        with:
          version: v0.17.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive candidate tag
        id: candidate
        run: echo "tag=candidate-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Both platforms are built here so the promoted manifest list serves arm64 nodes;
      # release-e2e exercises whichever one the runner is.
      - name: Build and push candidate image
        env:
          KO_DOCKER_REPO: ${{ env.IMAGE_REPOSITORY }}
        run: |
          ko build ./cmd/kyverno-runtime \
            --push=true \
            --bare \
            --tags="${{ steps.candidate.outputs.tag }}" \
            --platform=linux/amd64,linux/arm64

  # ---------------------------------------------------------------- ASSERTION
  # Gates the release on the candidate actually enforcing something. Mirrors the
  # e2e-egress lane in ci.yml: install gate, then egress allow/deny behavior.
  # BPF-LSM open/exec is NOT covered here for the same reason it is not in ci.yml --
  # hosted runners are not booted with lsm=...,bpf.
  release-e2e:
    name: "Assert: e2e against the candidate image"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [publish-candidate]
    env:
      DOCKER_CONFIG: /tmp/.docker
      IMAGE_TAG: ${{ needs.publish-candidate.outputs.candidate_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          config: test/e2e/kind-config.yaml

      - name: Install Chainsaw
        uses: ./.github/actions/install-chainsaw
        with:
          version: ${{ env.CHAINSAW_VERSION }}

      - name: Kernel preconditions
        run: |
          set -euo pipefail
          uname -a
          test -r /sys/kernel/btf/vmlinux || { echo "no BTF: the daemon cannot load its programs"; exit 1; }
          fs=$(stat -fc %T /sys/fs/cgroup)
          echo "cgroup fs: $fs"
          [ "$fs" = "cgroup2fs" ] || { echo "cgroup v2 unified hierarchy required for egress attach"; exit 1; }

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the exact artifact that will be promoted, rather than rebuilding it.
      - name: Pull the candidate image
        run: docker pull "${IMAGE_REPOSITORY}:${IMAGE_TAG}"

      - name: Install the candidate into kind (gate)
        run: make kind-install-prebuilt

      - name: Install gate assertions (daemonset Ready, no crash loop)
        run: make test-e2e-gate

      - name: Egress enforcement behavior
        run: make test-e2e-egress

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get runtimepolicies -o yaml || true
          kubectl -n kyverno-runtime get all || true
          kubectl -n kyverno-runtime logs -l app.kubernetes.io/name=kyverno-runtime --all-containers --tail=400 || true

  # Retags the tested digest instead of rebuilding, so the released image is the exact
  # artifact release-e2e ran. imagetools copies the whole manifest list, keeping both
  # platforms.
  promote-image:
    name: Promote Candidate to Release Tag
    runs-on: ubuntu-latest
    needs: [publish-candidate, release-e2e]
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the candidate as the release
        env:
          CANDIDATE_TAG: ${{ needs.publish-candidate.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_REPOSITORY}:${GITHUB_REF_NAME}" \
            "${IMAGE_REPOSITORY}:${CANDIDATE_TAG}"
          docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${GITHUB_REF_NAME}"

      - name: Resolve release image digest
        id: image_digest
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${GITHUB_REF_NAME}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signs the resolved digest, not the release tag: a tag is mutable and can be
      # repointed after signing, the digest is the exact artifact release-e2e passed.
      - name: Sign the release image
        run: cosign sign --yes "${IMAGE_REPOSITORY}@${{ steps.image_digest.outputs.digest }}"

      # The tag resolves to a manifest list (linux/amd64 + linux/arm64); scanning it
      # without a platform silently defaults to amd64 and omits arm64 coverage.
      - name: Resolve per-platform image digests
        id: platform_digests
        run: |
          set -euo pipefail
          raw="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${GITHUB_REF_NAME}" --raw)"
          amd64_digest="$(echo "$raw" | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')"
          arm64_digest="$(echo "$raw" | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest')"
          [ -n "$amd64_digest" ] || { echo "no linux/amd64 manifest found"; exit 1; }
          [ -n "$arm64_digest" ] || { echo "no linux/arm64 manifest found"; exit 1; }
          echo "amd64_digest=${amd64_digest}" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=${arm64_digest}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (linux/amd64)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_REPOSITORY }}@${{ steps.platform_digests.outputs.amd64_digest }}
          format: spdx-json
          output-file: kyverno-runtime-${{ github.ref_name }}-linux-amd64.spdx.json
          upload-artifact: false

      - name: Generate SBOM (linux/arm64)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_REPOSITORY }}@${{ steps.platform_digests.outputs.arm64_digest }}
          format: spdx-json
          output-file: kyverno-runtime-${{ github.ref_name }}-linux-arm64.spdx.json
          upload-artifact: false

      - name: Attach SBOMs to their platform images
        run: |
          set -euo pipefail
          cosign attach sbom \
            --sbom "kyverno-runtime-${GITHUB_REF_NAME}-linux-amd64.spdx.json" \
            "${IMAGE_REPOSITORY}@${{ steps.platform_digests.outputs.amd64_digest }}"
          cosign attach sbom \
            --sbom "kyverno-runtime-${GITHUB_REF_NAME}-linux-arm64.spdx.json" \
            "${IMAGE_REPOSITORY}@${{ steps.platform_digests.outputs.arm64_digest }}"

      - name: Attest build provenance for the release image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.image_digest.outputs.digest }}
          push-to-registry: true

      - name: Upload SBOMs for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: kyverno-runtime-${{ github.ref_name }}-linux-*.spdx.json

  publish-chart:
    name: Package & Publish Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    # The chart's appVersion points at the release image tag, so it must not publish
    # before that tag exists and has passed e2e.
    needs: [release-e2e, promote-image]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Derive and validate chart version
        id: chart_version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$ ]]; then
            echo "Tag '$TAG' must match v<major>.<minor>.<patch> (optionally with prerelease/build suffix)."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Chart version is semver, so it carries no leading v; appVersion is the image tag
      # the DaemonSet pulls, and promote-image tags the image with the git ref verbatim.
      - name: Set chart version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.chart_version.outputs.version }}"
          sed -i.bak -E "s/^version:.*/version: ${VERSION}/" charts/kyverno-runtime/Chart.yaml
          sed -i.bak -E "s/^appVersion:.*/appVersion: \"${GITHUB_REF_NAME}\"/" charts/kyverno-runtime/Chart.yaml
          rm -f charts/kyverno-runtime/Chart.yaml.bak

      - name: Verify the chart's appVersion resolves to a published image tag
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -nE 's/^appVersion: "(.*)"/\1/p' charts/kyverno-runtime/Chart.yaml)"
          docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${APP_VERSION}" >/dev/null

      - name: Lint chart
        run: helm lint charts/kyverno-runtime

      - name: Package chart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cr-release-packages
          helm package charts/kyverno-runtime --destination .cr-release-packages

      # Charts go to their own OCI namespace, separate from the image package: helm
      # appends the chart name, so this resolves to ghcr.io/nirmata/charts/kyverno-runtime
      # and never collides with the ghcr.io/nirmata/kyverno-runtime image.
      - name: Push chart to GHCR (OCI)
        id: chart_push
        shell: bash
        run: |
          set -euo pipefail
          CHART_PACKAGE=".cr-release-packages/kyverno-runtime-${{ steps.chart_version.outputs.version }}.tgz"
          push_output="$(helm push "$CHART_PACKAGE" oci://ghcr.io/nirmata/charts 2>&1)"
          echo "$push_output"
          digest="$(echo "$push_output" | awk '/^Digest:/{print $2}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the chart OCI artifact
        run: cosign sign --yes "ghcr.io/nirmata/charts/kyverno-runtime@${{ steps.chart_push.outputs.digest }}"

      - name: Attest build provenance for the chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/nirmata/charts/kyverno-runtime
          subject-digest: ${{ steps.chart_push.outputs.digest }}
          push-to-registry: true

  # Waits on both promote-image and publish-chart so the release page never appears until
  # every supply-chain artifact it links (image signature, SBOMs, chart) actually exists.
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [promote-image, publish-chart]

    steps:
      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sboms

      - name: Publish release with SBOMs
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: kyverno-runtime-${{ github.ref_name }}-linux-*.spdx.json
