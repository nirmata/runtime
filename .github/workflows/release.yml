name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  e2e-gate:
    # TODO: E2E gate temporarily disabled while eBPF/kind CI issue is investigated.
    # Re-enable by restoring the full job steps once the root cause is fixed.
    name: E2E Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: E2E gate skipped (temporarily disabled)
        run: echo "E2E gate is temporarily disabled. Proceeding to publish."

  publish-image:
    name: Build & Push Release Image
    runs-on: ubuntu-latest
    needs: e2e-gate

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up ko
        uses: ko-build/setup-ko@d982fec422852203cfb2053a8ec6ad302280d04d # v0.8
        with:
          version: v0.17.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        env:
          KO_DOCKER_REPO: ghcr.io/nirmata/kyverno-runtime
        run: |
          ko build ./cmd/kyverno-runtime \
            --push=true \
            --bare \
            --tags=${GITHUB_REF_NAME} \
            --platform=linux/amd64

  publish-chart:
    name: Package & Publish Helm Chart
    runs-on: ubuntu-latest
    env:
      DOCKER_CONFIG: /tmp/.docker
    needs: e2e-gate

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Derive and validate chart version
        id: chart_version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$ ]]; then
            echo "Tag '$TAG' must match v<major>.<minor>.<patch> (optionally with prerelease/build suffix)."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set chart version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.chart_version.outputs.version }}"
          sed -i.bak -E "s/^version:.*/version: ${VERSION}/" charts/kyverno-runtime/Chart.yaml
          sed -i.bak -E "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/kyverno-runtime/Chart.yaml
          rm -f charts/kyverno-runtime/Chart.yaml.bak

      - name: Lint chart
        run: helm lint charts/kyverno-runtime

      - name: Package chart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cr-release-packages
          helm package charts/kyverno-runtime --destination .cr-release-packages

      - name: Push chart to GHCR (OCI)
        shell: bash
        run: |
          set -euo pipefail
          CHART_PACKAGE=".cr-release-packages/kyverno-runtime-${{ steps.chart_version.outputs.version }}.tgz"
          helm push "$CHART_PACKAGE" oci://ghcr.io/nirmata/kyverno-runtime

      - name: Configure Git for chart-releaser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}


