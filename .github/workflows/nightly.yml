# Nightly regression signal for lanes ci.yml cannot run on a hosted PR runner.
#
# lsm-behavior is a full duplicate of the workflow_dispatch-gated job of the
# same name in ci.yml, kept for on-demand manual runs there. egress-load has
# no job-level counterpart in ci.yml: it mirrors test-e2e-egress-load, a
# workflow_dispatch-gated step inside ci.yml's always-on e2e-egress job. Both
# are duplicated here rather than refactored into a shared reusable workflow:
# ci.yml's job list is matched by name from the repository ruleset (see
# "Build & Unit Test" there), and this file's schedule trigger must not put
# every hosted PR job on a nightly cadence it does not need. A dedicated
# workflow keeps that risk out of ci.yml entirely, at the cost of two step
# lists to keep in sync when either side changes.
#
# lsm-behavior runs on a hosted runner and asserts open/exec enforcement
# through whichever hooks the kernel offers: BPF-LSM where the host was booted
# with `lsm=...,bpf`, and the fmod_ret dispatchers on `security_*` otherwise,
# which need no boot parameter. Nothing here requires a dedicated runner, so
# the lane always executes rather than skipping on an unset runner label —
# release.yml's nightly-gate reads this workflow's overall conclusion, and a
# lane that never ran told that gate nothing.
name: Nightly

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KIND_CLUSTER_NAME: kyverno-runtime
  CHAINSAW_VERSION: v0.2.15

jobs:
  # ------------------------------------------------- ASSERTION (kernel-bound)
  lsm-behavior:
    name: "Assert: open/exec enforcement behavior"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKER_CONFIG: /tmp/.docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Same cache key as ci.yml's lanes: every job compiles the same
      # ./cmd/kyverno-runtime, so whichever runs first warms the others. A
      # duplicate save is a warning, not a failure.
      - name: Restore the ko build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ko-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            ko-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            ko-build-${{ runner.os }}-

      - name: Set up ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.17.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Hard requirements only. The active LSM list decides which hooks the
      # daemon picks, not whether this lane can run, so it is reported and not
      # asserted -- and an unreadable list means securityfs is not mounted
      # here, which is no evidence about the kernel either way.
      - name: Kernel preconditions
        run: |
          set -euo pipefail
          uname -a
          test -r /sys/kernel/btf/vmlinux || { echo "no BTF: the daemon cannot load its programs"; exit 1; }
          fs=$(stat -fc %T /sys/fs/cgroup)
          echo "cgroup fs: $fs"
          [ "$fs" = "cgroup2fs" ] || { echo "cgroup v2 unified hierarchy required"; exit 1; }
          echo "active LSMs: $(cat /sys/kernel/security/lsm 2>/dev/null || echo 'unreadable')"

      - name: Load every committed BPF program (verifier log on rejection)
        run: sudo -E env "PATH=$PATH" make test-bpf-verify

      - name: Program map writes + attach smoke
        run: sudo -E env "PATH=$PATH" make test-bpf-smoke

      # The two steps above run go as root with -E, which keeps
      # HOME=/home/runner, so the module cache picks up root-owned entries.
      # install-ko below runs `go install` unprivileged and cannot create
      # files underneath them.
      - name: Return the Go caches to the runner user
        run: sudo chown -R "$(id -u):$(id -g)" "$(go env GOPATH)" "$(go env GOCACHE)"

      # One tag for both the build below and the load further down; IMAGE_TAG
      # is `?=` in the Makefile, so the environment wins.
      - name: Resolve the image tag
        run: echo "IMAGE_TAG=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"

      # Backgrounded so the compile overlaps kind provisioning instead of
      # following it. Must start after the chown above, or root's leftovers and
      # the restored cache fight over the same tree.
      - name: Start the image build
        run: |
          rm -f /tmp/ko-build.status
          nohup bash -c 'make ko-build; echo $? > /tmp/ko-build.status' \
            > /tmp/ko-build.log 2>&1 &

      - name: Set up kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          config: test/e2e/kind-config.yaml

      # Installed by hand rather than via a marketplace action so the pin is a
      # release tarball we control (matches the previous e2e workflow).
      - name: Install Chainsaw
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            x86_64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) echo "Unsupported architecture: $arch"; exit 1 ;;
          esac
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          mkdir -p "$HOME/.local/bin"
          url="https://github.com/kyverno/chainsaw/releases/download/${CHAINSAW_VERSION}/chainsaw_${os}_${arch}.tar.gz"
          curl -sSfL "$url" -o /tmp/chainsaw.tar.gz
          tar -xzf /tmp/chainsaw.tar.gz -C /tmp chainsaw
          install -m 0755 /tmp/chainsaw "$HOME/.local/bin/chainsaw"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/chainsaw" version

      - name: Wait for the image build
        run: |
          set -euo pipefail
          for _ in $(seq 1 600); do
            [ -f /tmp/ko-build.status ] && break
            sleep 1
          done
          cat /tmp/ko-build.log
          rc=$(cat /tmp/ko-build.status 2>/dev/null || echo "timeout")
          [ "$rc" = "0" ] || { echo "ko build failed: $rc"; exit 1; }

      - name: Save the ko build cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ko-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

      # logLevel=4 so the daemon's V(2)/V(4) lines -- pod matches, cgid
      # programming, policy sync -- reach the dump below. At the default level
      # it emits one line for the whole run.
      - name: Install the chart into kind (gate)
        run: make kind-install-prebuilt HELM_EXTRA_ARGS='--set daemon.logLevel=4'

      - name: Enforcement behavior (open deny/allow, exec deny/allow)
        run: make test-e2e-lsm

      # Chainsaw's cleanup has already deleted the test pod and policy by the
      # time this runs -- the per-test `finally:` block is what captures those.
      # What survives here is the daemon.
      - name: Dump cluster state on failure
        if: failure()
        run: |
          set +e
          echo "::group::pods"
          kubectl get pods -A -o wide
          echo "::endgroup::"
          echo "::group::runtimepolicies still present"
          kubectl get runtimepolicies -A -o yaml
          echo "::endgroup::"
          echo "::group::daemon"
          kubectl -n kyverno-runtime get all
          for pod in $(kubectl -n kyverno-runtime get pods -o name); do
            echo "----- $pod -----"
            kubectl -n kyverno-runtime logs "$pod" --all-containers --tail=-1
            echo "----- $pod (previous container, if it restarted) -----"
            kubectl -n kyverno-runtime logs "$pod" --all-containers --previous --tail=-1
          done
          echo "::endgroup::"

  # ------------------------------------------------- ASSERTION (kernel-bound)
  #
  # test-e2e-egress-load is dispatch-gated in ci.yml because it is a load run
  # against the hosted e2e-egress job's cluster, not because it needs anything
  # a hosted runner lacks: cgroup v2 and BPF support, which ubuntu-latest has.
  # It has never executed on a schedule before this job.
  egress-load:
    name: "Assert: egress observation under load (k6)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_CONFIG: /tmp/.docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.17.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          config: test/e2e/kind-config.yaml

      - name: Kernel preconditions
        run: |
          set -euo pipefail
          uname -a
          test -r /sys/kernel/btf/vmlinux || { echo "no BTF: the daemon cannot load its programs"; exit 1; }
          fs=$(stat -fc %T /sys/fs/cgroup)
          echo "cgroup fs: $fs"
          [ "$fs" = "cgroup2fs" ] || { echo "cgroup v2 unified hierarchy required for egress attach"; exit 1; }

      - name: Build image and install the chart into kind (gate)
        run: make kind-install IMAGE_TAG="$(git describe --tags --always --dirty)"

      - name: Egress observation under load (k6)
        run: make test-e2e-egress-load

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get runtimepolicies -o yaml || true
          kubectl -n kyverno-runtime get all || true
          kubectl -n kyverno-runtime logs -l app.kubernetes.io/name=kyverno-runtime --all-containers --tail=400 || true
