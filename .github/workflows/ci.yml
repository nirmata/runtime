# CI for kyverno-runtime.
#
# HONESTY NOTE -- read before adding or renaming a job.
#
# Some lanes here are ASSERTIONS (they fail when the product misbehaves) and some
# are GATES (they fail only when the build/install breaks). Every job name says
# which it is. Do not rename a gate to sound like an assertion, and do not add
# eBPF-derived assertions to a gate job: hosted GitHub runners cannot satisfy
# them and the result is a red test that eventually gets muted.
#
# Coverage of the eBPF layer on hosted runners:
#   * program load + verifier acceptance for every committed object that does
#     not need BPF-LSM: ASSERTED (bpf-verifier-smoke). The set of objects lives
#     in the table in test/e2e/bpfverify_test.go, and a committed object with no
#     entry there fails the unit suite, so this lane cannot silently lose a
#     program.
#   * egress allow/deny packet behavior end to end: ASSERTED (e2e-egress).
#   * open/exec enforcement behavior: ASSERTED (lsm-behavior), through the
#     fmod_ret dispatcher on `security_file_open`, which needs no boot
#     parameter.
#   * the same behavior through the BPF_PROG_TYPE_LSM hooks file_open /
#     bprm_check_security: NOT COVERED on a hosted runner, and this is measured
#     rather than assumed. Such a program is refused at load unless `bpf` is in
#     /sys/kernel/security/lsm, which comes from the `lsm=` boot parameter; no
#     job, container or kind node can change it. On ubuntu-latest that list
#     reads:
#         lockdown,capability,landlock,yama,apparmor,ima,evm
#     lsm-behavior takes a runner label as a workflow_dispatch input; point it
#     at a qualifying runner to cover them. The two hook sets do not enforce
#     identically -- see "An exec evaluates both chains" in docs/dev/DESIGN.md.
#   * committed *_bpfel.o / *_bpfeb.o matching their _cprog sources: GATED
#     (bpf-object-drift recompiles the C with the pinned clang in
#     hack/bpf-builder and fails on any byte difference; it asserts nothing
#     about runtime behavior).
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      lsm_runner:
        description: >-
          Runner label for the BPF-LSM behavior lane. The default cannot satisfy
          it; point this at a self-hosted runner or VM booted with lsm=...,bpf.
        type: string
        default: ubuntu-latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KIND_CLUSTER_NAME: kyverno-runtime
  CHAINSAW_VERSION: v0.2.15

jobs:
  # ---------------------------------------------------------------- ASSERTION
  unit:
    # NAME IS LOAD-BEARING: "Build & Unit Test" is the required status check in
    # the repository ruleset for main. A required check is matched by job NAME,
    # so renaming this job leaves the requirement permanently "Expected —
    # waiting for status to be reported" and the PR unmergeable, with no failure
    # anywhere to explain why. If this job is ever renamed, update the ruleset in
    # the same change. (This job asserts: it fails when the product misbehaves.)
    name: Build & Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # setup-go's cache is keyed on go.sum alone and is only written on a key
      # miss, so it never carries entries for source that changed since go.sum
      # last did -- which is every ordinary PR. Rotate on sha, fall back to the
      # newest cache for this go.sum.
      - name: Restore the build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: unit-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            unit-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            unit-${{ runner.os }}-

      - name: Build
        run: go build ./...

      # -race is the point of running the unit suites on Linux: the managers,
      # collector and status writer are all concurrent.
      - name: Unit tests
        run: make test-unit

      # pkg/proto/finding is its own module (a nested go.mod is a hard module
      # boundary), so the root ./... above never touches it. Runs before the
      # cache save below so its build output is captured too.
      - name: Build and test the pkg/proto/finding submodule
        working-directory: pkg/proto/finding
        run: |
          go build ./...
          go vet ./...
          go test ./...

      # Saved on failure too: a post step is skipped when the job fails, which
      # would leave the next run compiling cold exactly while someone iterates
      # on a red suite.
      - name: Save the build cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: unit-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  # ---------------------------------------------------------------- ASSERTION
  lint:
    # Separate from "Build & Unit Test" because nothing here needs the build and
    # nothing there needs the lint: run concurrently, the slower of the two sets
    # the PR's wall clock instead of their sum.
    name: "Assert: format, lint and vet"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Verify formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "The following files are not properly formatted:"
            echo "$out"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4

      # golangci-lint resolves packages through the nearest go.mod, so the
      # pkg/proto/finding submodule needs its own invocation.
      - name: golangci-lint (pkg/proto/finding)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          working-directory: pkg/proto/finding

      - name: markdownlint
        run: npx -y markdownlint-cli2 "**/*.md" "#vendor" "#bin"

      - name: Vet
        run: go vet ./...

  # -------------------------------------------------------------------- GATE
  helm:
    name: "Gate: helm lint/template + CRD codegen drift"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Renders with defaults and with the toggles flipped, and asserts the
      # metrics port actually reaches the daemon args.
      - name: Lint and template the chart
        run: make helm-verify

      # A real assertion despite living in the gate job: the committed CRDs must
      # match what the PINNED controller-gen produces from api/v1alpha1.
      # Unpinned, the controller-gen.kubebuilder.io/version annotation flaps with
      # whatever version each host happens to resolve.
      - name: CRD codegen drift (pinned controller-gen)
        run: make verify-crds

      - name: Deepcopy codegen drift (pinned controller-gen)
        run: make verify-deepcopy

  # -------------------------------------------------------------------- GATE
  bpf-object-drift:
    name: "Gate: BPF object drift (committed *_bpfe*.o match _cprog sources)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The host Go toolchain only resolves GOMODCACHE for the bind mount;
      # compilation happens inside hack/bpf-builder, whose pinned clang is the
      # reproducibility contract.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # A gate, not an assertion: it proves the committed bytecode is exactly
      # what the pinned toolchain produces from the committed C (and that the
      # minimal vmlinux.h still compiles it). It says nothing about whether the
      # programs load or enforce anything -- that is the verifier-smoke and e2e
      # lanes' job.
      - name: Recompile BPF objects and diff against the committed ones
        run: make verify-bpf

  # ---------------------------------------------------------------- ASSERTION
  chainsaw-crd:
    name: "Assert: CRD schema/admission conformance (chainsaw on kind, no daemon)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      # No image, no chart, no eBPF: everything asserted here is decided by the
      # apiserver from the generated OpenAPI schema and its CEL rules.
      - name: Set up kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: crd-conformance

      - name: Install Chainsaw
        uses: ./.github/actions/install-chainsaw
        with:
          version: ${{ env.CHAINSAW_VERSION }}

      - name: Chainsaw CRD conformance (valid accepted, invalid rejected)
        run: make test-chainsaw

  # ------------------------------------------------- ASSERTION (kernel-bound)
  bpf-verifier-smoke:
    name: "Assert: committed BPF programs load & pass the verifier (Linux, root)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Fail loudly on a runner that cannot host the test at all, rather than
      # letting the Go test skip and report green.
      - name: Kernel preconditions
        run: |
          set -euo pipefail
          uname -a
          echo "--- BTF ---"
          test -r /sys/kernel/btf/vmlinux || { echo "no /sys/kernel/btf/vmlinux: CO-RE relocation impossible"; exit 1; }
          echo "--- cgroup version ---"
          stat -fc %T /sys/fs/cgroup
          echo "--- active LSMs (informational; BPF-LSM is NOT required by this job) ---"
          cat /sys/kernel/security/lsm || echo "unreadable"

      # sudo -E keeps GOCACHE/GOPATH so this reuses the module cache. The Go test
      # skips (not fails) if the environment turns out unsuitable; the step above
      # is what makes an unsuitable runner loud.
      #
      # Adding a BPF program does not touch this file: test-bpf-verify walks the
      # table in test/e2e/bpfverify_test.go.
      - name: Load every committed BPF program (verifier log on rejection)
        run: sudo -E env "PATH=$PATH" make test-bpf-verify

      - name: Program and read back the egress maps
        run: sudo -E env "PATH=$PATH" make test-bpf-smoke

  # ------------------------------------------------- ASSERTION (kernel-bound)
  e2e-egress:
    name: "Assert: egress and protocol allow/deny enforcement on kind (Linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCKER_CONFIG: /tmp/.docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # ko builds with CGO_ENABLED=0 (see .ko.yaml), which shares no build cache
      # entries with the cgo-enabled `go build` and `go test -race` in the unit
      # job. setup-go's cache is keyed on go.sum alone and is only written on a
      # key miss, so it never picks these up. Rotate on sha and fall back to the
      # newest cache for this go.sum.
      - name: Restore the ko build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ko-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            ko-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            ko-build-${{ runner.os }}-

      - name: Set up ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.17.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Resolve the image tag
        run: echo "IMAGE_TAG=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"

      # Started before the cluster so the image compiles while kind boots: the
      # two are the largest steps in this job and neither needs the other. The
      # exit code lands in a file because the build outlives the shell that
      # spawned it, so no later step can `wait` on it.
      - name: Start the image build
        run: |
          rm -f /tmp/ko-build.status
          nohup bash -c 'make ko-build; echo $? > /tmp/ko-build.status' \
            > /tmp/ko-build.log 2>&1 &

      - name: Set up kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          config: test/e2e/kind-config.yaml

      - name: Install Chainsaw
        uses: ./.github/actions/install-chainsaw
        with:
          version: ${{ env.CHAINSAW_VERSION }}

      - name: Kernel preconditions
        run: |
          set -euo pipefail
          uname -a
          test -r /sys/kernel/btf/vmlinux || { echo "no BTF: the daemon cannot load its programs"; exit 1; }
          fs=$(stat -fc %T /sys/fs/cgroup)
          echo "cgroup fs: $fs"
          [ "$fs" = "cgroup2fs" ] || { echo "cgroup v2 unified hierarchy required for egress attach"; exit 1; }

      - name: Wait for the image build
        run: |
          set -euo pipefail
          for _ in $(seq 1 600); do
            [ -f /tmp/ko-build.status ] && break
            sleep 1
          done
          cat /tmp/ko-build.log
          rc=$(cat /tmp/ko-build.status 2>/dev/null || echo "timeout")
          [ "$rc" = "0" ] || { echo "ko build failed: $rc"; exit 1; }

      # Saved here rather than in a post step: a post step does not run when the
      # job fails, so a red suite would leave the next run to compile cold --
      # slowest exactly while someone is iterating on a failure.
      - name: Save the ko build cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ko-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

      # Load into kind, install the chart, wait for rollout. This step is a
      # GATE: it proves install works and nothing about enforcement.
      - name: Install the chart into kind (gate)
        run: make kind-install-prebuilt

      # Every suite a hosted runner can satisfy, concurrently against the one
      # cluster: the install gate, egress allow/deny on pod IPs, Service and
      # domain targets, overlapping policies with pod-first ordering, and the
      # application-protocol classifier. Each is two-sided -- the allowed target
      # or protocol must stay reachable while the denied one is dropped -- since
      # a one-sided test also passes against a program that drops everything.
      - name: Egress, protocol and install assertions
        run: make test-e2e-hosted

      # Reuses the cluster and chart this job already installed: no new job, no
      # second image build. Dispatch-gated because it is a load run, not a
      # correctness one -- the k6 scenario alone is two minutes, and the lane it
      # would join was deliberately cut to about five.
      - name: Egress observation under load (k6)
        if: github.event_name == 'workflow_dispatch'
        run: make test-e2e-egress-load

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get runtimepolicies -o yaml || true
          kubectl -n kyverno-runtime get all || true
          kubectl -n kyverno-runtime logs -l app.kubernetes.io/name=kyverno-runtime --all-containers --tail=400 || true

  # ------------------------------------------------- ASSERTION (kernel-bound)
  #
  # open/exec enforcement behavior. Which hooks carry it is a property of the
  # runner: `file_open` and `bprm_check_security` as BPF_PROG_TYPE_LSM programs
  # where the kernel was booted with `bpf` in /sys/kernel/security/lsm, and the
  # fmod_ret dispatcher on `security_file_open` otherwise, which needs no boot
  # parameter. A hosted runner exercises the second, so this lane runs on every
  # PR; point it at a runner booted with lsm=...,bpf to exercise the first.
  # See "An exec evaluates both chains" in docs/dev/DESIGN.md for what differs
  # between the two.
  lsm-behavior:
    name: "Assert: open/exec enforcement behavior"
    runs-on: ${{ inputs.lsm_runner || 'ubuntu-22.04' }}
    timeout-minutes: 60
    env:
      DOCKER_CONFIG: /tmp/.docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Same cache key as e2e-egress: both jobs compile the same
      # ./cmd/kyverno-runtime, so whichever runs first warms the other. A
      # duplicate save is a warning, not a failure.
      - name: Restore the ko build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ko-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            ko-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            ko-build-${{ runner.os }}-

      - name: Set up ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.17.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Hard requirements only. The active LSM list decides which hooks the
      # daemon picks, not whether this lane can run, so it is reported and not
      # asserted -- and an unreadable list means securityfs is not mounted
      # here, which is no evidence about the kernel either way.
      - name: Kernel preconditions
        run: |
          set -euo pipefail
          uname -a
          test -r /sys/kernel/btf/vmlinux || { echo "no BTF: the daemon cannot load its programs"; exit 1; }
          fs=$(stat -fc %T /sys/fs/cgroup)
          echo "cgroup fs: $fs"
          [ "$fs" = "cgroup2fs" ] || { echo "cgroup v2 unified hierarchy required"; exit 1; }
          echo "active LSMs: $(cat /sys/kernel/security/lsm 2>/dev/null || echo 'unreadable')"

      - name: Load every committed BPF program (verifier log on rejection)
        run: sudo -E env "PATH=$PATH" make test-bpf-verify

      - name: Program map writes + attach smoke
        run: sudo -E env "PATH=$PATH" make test-bpf-smoke

      # The two steps above run go as root with -E, which keeps
      # HOME=/home/runner, so the module cache picks up root-owned entries.
      # install-ko below runs `go install` unprivileged and cannot create
      # files underneath them.
      - name: Return the Go caches to the runner user
        run: sudo chown -R "$(id -u):$(id -g)" "$(go env GOPATH)" "$(go env GOCACHE)"

      # One tag for both the build below and the load further down; IMAGE_TAG
      # is `?=` in the Makefile, so the environment wins.
      - name: Resolve the image tag
        run: echo "IMAGE_TAG=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"

      # Backgrounded so the compile overlaps kind provisioning instead of
      # following it. Must start after the chown above, or root's leftovers and
      # the restored cache fight over the same tree.
      - name: Start the image build
        run: |
          rm -f /tmp/ko-build.status
          nohup bash -c 'make ko-build; echo $? > /tmp/ko-build.status' \
            > /tmp/ko-build.log 2>&1 &

      - name: Set up kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          config: test/e2e/kind-config.yaml

      - name: Install Chainsaw
        uses: ./.github/actions/install-chainsaw
        with:
          version: ${{ env.CHAINSAW_VERSION }}

      - name: Wait for the image build
        run: |
          set -euo pipefail
          for _ in $(seq 1 600); do
            [ -f /tmp/ko-build.status ] && break
            sleep 1
          done
          cat /tmp/ko-build.log
          rc=$(cat /tmp/ko-build.status 2>/dev/null || echo "timeout")
          [ "$rc" = "0" ] || { echo "ko build failed: $rc"; exit 1; }

      - name: Save the ko build cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ko-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

      # logLevel=4 so the daemon's V(2)/V(4) lines -- pod matches, cgid
      # programming, policy sync -- reach the dump below. At the default level
      # it emits one line for the whole run.
      - name: Install the chart into kind (gate)
        run: make kind-install-prebuilt HELM_EXTRA_ARGS='--set daemon.logLevel=4'

      - name: Enforcement behavior (open deny/allow, exec deny/allow)
        run: make test-e2e-lsm

      # Chainsaw's cleanup has already deleted the test pod and policy by the
      # time this runs -- the per-test `finally:` block is what captures those.
      # What survives here is the daemon.
      - name: Dump cluster state on failure
        if: failure()
        run: |
          set +e
          echo "::group::pods"
          kubectl get pods -A -o wide
          echo "::endgroup::"
          echo "::group::runtimepolicies still present"
          kubectl get runtimepolicies -A -o yaml
          echo "::endgroup::"
          echo "::group::daemon"
          kubectl -n kyverno-runtime get all
          for pod in $(kubectl -n kyverno-runtime get pods -o name); do
            echo "----- $pod -----"
            kubectl -n kyverno-runtime logs "$pod" --all-containers --tail=-1
            echo "----- $pod (previous container, if it restarted) -----"
            kubectl -n kyverno-runtime logs "$pod" --all-containers --previous --tail=-1
          done
          echo "::endgroup::"
