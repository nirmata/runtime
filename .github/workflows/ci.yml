name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901fc3370adc70c8f6d4e092ea4262a4a7 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@1a4442cbad2d4d63b59a7797da999c1fb20f9a4d # v4.0.1
        with:
          node-version: "20"

      - name: Verify formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "The following files are not properly formatted:"
            echo "$out"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@3cfe3a4abbb84efff3f25b9d7b3b97f7b3c6f6f9 # v6.0.0
        with:
          version: v2.11.4

      - name: markdownlint
        run: npx -y markdownlint-cli2 "**/*.md" "#vendor" "#bin"

      - name: Build
        run: go build ./cmd/kyverno-runtime

      - name: Test
        run: go test ./...
