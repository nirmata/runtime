name: E2E

on:
  workflow_dispatch:
    inputs:
      suite:
        description: E2E suite to run
        required: true
        default: quickstart
        type: choice
        options:
          - quickstart
          - full
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: kind + Chainsaw E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KIND_CLUSTER_NAME: kyverno-runtime

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up kubectl
        uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0

      - name: Set up kind
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}

      - name: Install ko and Chainsaw
        run: |
          go install github.com/google/ko@v0.18.0
          go install github.com/kyverno/chainsaw@v0.2.14
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run E2E
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "Release tag push detected; attempting to reuse published image before fallback build"
            IMAGE_REF="ghcr.io/nirmata/kyverno-runtime:${GITHUB_REF_NAME}"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            pulled=false
            for attempt in {1..10}; do
              if docker pull "${IMAGE_REF}"; then
                pulled=true
                break
              fi
              echo "Image not available yet (${attempt}/10); retrying in 30s"
              sleep 30
            done

            if [[ "${pulled}" == "true" ]]; then
              echo "Reusing prebuilt image ${IMAGE_REF} for E2E"
              make test-e2e-install-prebuilt IMAGE_REPOSITORY=ghcr.io/nirmata/kyverno-runtime IMAGE_TAG="${GITHUB_REF_NAME}"
            else
              echo "Falling back to local ko build for E2E"
              make test-e2e-install IMAGE_REPOSITORY=ghcr.io/nirmata/kyverno-runtime IMAGE_TAG="${GITHUB_REF_NAME}"
            fi
            exit 0
          fi

          if [[ "${{ inputs.suite }}" == "full" ]]; then
            echo "Manual run requested full suite"
            make test-e2e-install
          else
            echo "Manual run requested quickstart suite"
            make kind-install smoke-quickstart
          fi

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get reports -A || true
          kubectl -n kyverno-runtime get all || true
          kubectl -n kyverno-runtime logs -l app.kubernetes.io/name=kyverno-runtime --tail=200 || true