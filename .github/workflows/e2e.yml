name: E2E

on:
  workflow_dispatch:
    inputs:
      suite:
        description: E2E suite to run
        required: true
        default: quickstart
        type: choice
        options:
          - quickstart
          - full
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  e2e:
    name: kind + Chainsaw E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KIND_CLUSTER_NAME: kyverno-runtime

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up kubectl
        uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0

      - name: Set up kind
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}

      - name: Install ko and Chainsaw
        run: |
          go install github.com/google/ko@latest
          go install github.com/kyverno/chainsaw@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run E2E
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "Release tag push detected, running full E2E suite"
            make test-e2e-install
            exit 0
          fi

          if [[ "${{ inputs.suite }}" == "full" ]]; then
            echo "Manual run requested full suite"
            make test-e2e-install
          else
            echo "Manual run requested quickstart suite"
            make kind-install smoke-quickstart
          fi

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get reports -A || true
          kubectl -n kyverno-runtime get all || true
          kubectl -n kyverno-runtime logs -l app.kubernetes.io/name=kyverno-runtime --tail=200 || true