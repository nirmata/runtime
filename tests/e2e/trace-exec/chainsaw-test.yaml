# E2E test: Verify that exec events in a pod generate a PolicyReport.
#
# Prerequisites:
#   - kind cluster with kyverno-runtime installed (make kind-install)
#   - CRDs for RuntimePolicy and PolicyReport deployed
#
# This test:
#   1. Creates a namespace with runtime-monitor=enabled label
#   2. Applies a RuntimePolicy that detects exec events
#   3. Creates a pod that runs commands
#   4. Asserts a PolicyReport is created with the expected finding
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: trace-exec-detection
spec:
  timeouts:
    apply: 30s
    assert: 120s
    cleanup: 60s
  steps:
  # Step 1: Create namespace with runtime-monitor label
  - name: setup-namespace
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: e2e-trace-exec
            labels:
              runtime-monitor: "enabled"

  # Step 2: Apply RuntimePolicy for detecting exec events
  - name: apply-runtime-policy
    try:
    - apply:
        resource:
          apiVersion: runtime.kyverno.io/v1alpha1
          kind: RuntimePolicy
          metadata:
            name: e2e-detect-exec
          spec:
            namespaceSelector:
              matchLabels:
                runtime-monitor: "enabled"
            validations:
            - name: detect-exec
              event: exec
              message: Exec detected via live Inspektor Gadget trace
              severity: high
              matchConditions:
              - expression: size(event) > 0
              actions:
              - type: generate_report
                message: Record exec event in PolicyReport

  # Step 3: Create a pod that executes commands
  - name: create-demo-pod
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: e2e-exec-demo
            namespace: e2e-trace-exec
            labels:
              app: e2e-exec-demo
          spec:
            containers:
            - name: app
              image: busybox:1.36
              command: ["sh", "-c", "while true; do cat /etc/hosts; sleep 2; done"]
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: e2e-exec-demo
            namespace: e2e-trace-exec
          status:
            phase: Running

  # Step 4: Wait for PolicyReport to be created with findings
  - name: assert-policy-report
    try:
    - assert:
        resource:
          apiVersion: wgpolicyk8s.io/v1alpha2
          kind: PolicyReport
          metadata:
            namespace: e2e-trace-exec
            labels:
              app.kubernetes.io/managed-by: kyverno-runtime
              runtime.kyverno.io/policy: e2e-detect-exec
          (scope != null): true
          (results != null): true
          (length(results) > `0`): true

  # Cleanup
  - name: cleanup
    try:
    - delete:
        ref:
          apiVersion: v1
          kind: Pod
          name: e2e-exec-demo
          namespace: e2e-trace-exec
    - delete:
        ref:
          apiVersion: runtime.kyverno.io/v1alpha1
          kind: RuntimePolicy
          name: e2e-detect-exec
    - delete:
        ref:
          apiVersion: v1
          kind: Namespace
          name: e2e-trace-exec
