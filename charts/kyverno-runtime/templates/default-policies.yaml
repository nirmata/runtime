{{- if .Values.defaultPolicies.enabled }}
# Default RuntimePolicy Library - Curated policies for day-1 threat detection
# These policies detect known attack patterns using the signature engine

---
{{- if .Values.defaultPolicies.policies.credentialAccess }}
# Policy 1: Credential Access Detection
# Detects attempts to access sensitive credential files
# Maps to MITRE ATT&CK: T1110 (Brute Force), T1087 (Account Discovery)
apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: detect-credential-access
  labels:
    app.kubernetes.io/name: kyverno-runtime
    app.kubernetes.io/component: default-policies
    app.kubernetes.io/version: "{{ .Chart.AppVersion }}"
    policy.kyverno.io/severity: critical
spec:
  validations:
  - name: ssh-key-access
    event: open
    message: "Suspicious SSH private key access detected"
    severity: critical
    conditions:
    - name: ssh-private-key-pattern
      expression: |
        event["file.path"].contains("/.ssh/") || 
        event["file.path"].contains("/id_rsa") ||
        event["file.path"].contains("/id_ed25519")
    actions:
    - type: audit
      message: "SSH key access detected - potential lateral movement preparation"
  
  - name: shadow-file-access
    event: open
    message: "System password file access detected"
    severity: critical
    conditions:
    - name: shadow-passwd-pattern
      expression: |
        event["file.path"] == "/etc/shadow" || 
        event["file.path"] == "/etc/passwd"
    actions:
    - type: audit
      message: "Password file access detected - potential privilege escalation attempt"
  
  - name: api-key-access
    event: open
    message: "API credential access detected"
    severity: high
    conditions:
    - name: api-key-pattern
      expression: |
        event["file.path"].contains("/.aws/credentials") ||
        event["file.path"].contains("/.aws/config") ||
        event["file.path"].contains("/.docker/config.json") ||
        event["file.path"].contains("/.kube/config") ||
        event["file.path"].contains(".env") ||
        event["file.path"].contains(".secrets")
    actions:
    - type: audit
      message: "API credential location accessed - potential cloud credential theft"
{{- end }}

---
{{- if .Values.defaultPolicies.policies.shellExecution }}
# Policy 2: Shell Execution Detection
# Detects unexpected shell or interpreter spawning
# Maps to MITRE ATT&CK: T1059 (Command and Scripting Interpreter), T1047 (Windows Management Instrumentation)
apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: detect-shell-execution
  labels:
    app.kubernetes.io/name: kyverno-runtime
    app.kubernetes.io/component: default-policies
    app.kubernetes.io/version: "{{ .Chart.AppVersion }}"
    policy.kyverno.io/severity: high
spec:
  validations:
  - name: shell-spawning
    event: exec
    message: "Suspicious shell or interpreter execution detected"
    severity: high
    conditions:
    - name: shell-pattern
      expression: |
        event["process.name"].contains("/bin/sh") ||
        event["process.name"].contains("/bin/bash") ||
        event["process.name"].contains("/usr/bin/python") ||
        event["process.name"].contains("/usr/bin/perl") ||
        event["process.name"].contains("/usr/bin/ruby")
    actions:
    - type: audit
      message: "Shell execution detected - potential RCE or command injection exploit"
{{- end }}

---
{{- if .Values.defaultPolicies.policies.sensitiveFileAccess }}
# Policy 3: Sensitive File Access Detection
# Detects access to sensitive system configuration and metadata files
# Maps to MITRE ATT&CK: T1005 (Data from Local System), T1526 (Enumerate Cloud Resources)
apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: detect-sensitive-file-access
  labels:
    app.kubernetes.io/name: kyverno-runtime
    app.kubernetes.io/component: default-policies
    app.kubernetes.io/version: "{{ .Chart.AppVersion }}"
    policy.kyverno.io/severity: medium
spec:
  validations:
  - name: system-config-access
    event: open
    message: "Sensitive system configuration file accessed"
    severity: medium
    conditions:
    - name: system-config-pattern
      expression: |
        event["file.path"] == "/etc/hosts" ||
        event["file.path"] == "/etc/hostname" ||
        event["file.path"] == "/etc/resolv.conf" ||
        event["file.path"].contains("/etc/sudoers")
    actions:
    - type: audit
      message: "System configuration file accessed"
  
  - name: proc-filesystem-access
    event: open
    message: "Process information enumeration detected"
    severity: low
    conditions:
    - name: proc-pattern
      expression: |
        event["file.path"].startsWith("/proc/") &&
        event["file.path"].contains("status")
    actions:
    - type: audit
      message: "Process discovery via /proc filesystem"
{{- end }}

---
{{- if .Values.defaultPolicies.policies.publicNetworkEgress }}
# Policy 4: Public Network Egress Detection
# Detects outbound connections to public IP addresses (data exfiltration indicator)
# Maps to MITRE ATT&CK: T1048 (Exfiltration Over Alternative Protocol), T1020 (Automated Exfiltration)
apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: detect-public-network-egress
  labels:
    app.kubernetes.io/name: kyverno-runtime
    app.kubernetes.io/component: default-policies
    app.kubernetes.io/version: "{{ .Chart.AppVersion }}"
    policy.kyverno.io/severity: warning
spec:
  validations:
  - name: public-ip-egress
    event: tcpconnect
    message: "Outbound connection to public IP detected"
    severity: warning
    conditions:
    - name: public-ip-pattern
      expression: |
        event["dst.ip"].contains("8.8.8.8") ||
        event["dst.ip"].contains("1.1.1.1") ||
        !event["dst.ip"].startsWith("10.") &&
        !event["dst.ip"].startsWith("172.") &&
        !event["dst.ip"].startsWith("192.168.")
    actions:
    - type: audit
      message: "Outbound connection to public network detected - potential data exfiltration"
{{- end }}

---
{{- if .Values.defaultPolicies.policies.metadataEndpointEgress }}
# Policy 5: Metadata Endpoint Egress Detection
# Detects outbound connections to cloud metadata service endpoints
# Maps to MITRE ATT&CK: T1552 (Unsecured Credentials), T1528 (Steal Application Access Token)
apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: detect-metadata-endpoint-egress
  labels:
    app.kubernetes.io/name: kyverno-runtime
    app.kubernetes.io/component: default-policies
    app.kubernetes.io/version: "{{ .Chart.AppVersion }}"
    policy.kyverno.io/severity: high
spec:
  validations:
  - name: metadata-endpoint-access
    event: tcpconnect
    message: "Connection to cloud metadata endpoint detected"
    severity: high
    conditions:
    - name: metadata-endpoint-pattern
      expression: |
        event["dst.ip"] == "169.254.169.254" ||
        event["dst.ip"] == "169.254.170.2" ||
        event["dst.ip"] == "100.100.100.200"
    actions:
    - type: audit
      message: "Metadata endpoint egress detected - potential cloud credential theft"
{{- end }}

---
{{- if .Values.defaultPolicies.policies.processDiscovery }}
# Policy 6: Process Discovery Detection
# Detects process enumeration activities
# Maps to MITRE ATT&CK: T1057 (Process Discovery)
apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: detect-process-discovery
  labels:
    app.kubernetes.io/name: kyverno-runtime
    app.kubernetes.io/component: default-policies
    app.kubernetes.io/version: "{{ .Chart.AppVersion }}"
    policy.kyverno.io/severity: low
spec:
  validations:
  - name: proc-enumeration
    event: open
    message: "Process enumeration detected"
    severity: low
    conditions:
    - name: proc-status-pattern
      expression: |
        event["file.path"].startsWith("/proc/") &&
        event["file.path"].contains("/status")
    actions:
    - type: audit
      message: "Process discovery via /proc filesystem - reconnaissance activity"
{{- end }}

---
{{- if .Values.defaultPolicies.policies.securityToolDisruption }}
# Policy 7: Security Tool Disruption Detection
# Detects attempts to disable or interfere with security tools
# Maps to MITRE ATT&CK: T1562 (Impair Defenses)
apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: detect-security-tool-disruption
  labels:
    app.kubernetes.io/name: kyverno-runtime
    app.kubernetes.io/component: default-policies
    app.kubernetes.io/version: "{{ .Chart.AppVersion }}"
    policy.kyverno.io/severity: high
spec:
  validations:
  - name: disable-security-tools
    event: exec
    message: "Execution of security tool disruption commands detected"
    severity: high
    conditions:
    - name: security-tool-pattern
      expression: |
        event["process.name"].contains("iptables") ||
        event["process.name"].contains("ufw") ||
        event["process.name"].contains("firewall") ||
        event["process.name"].contains("auditctl") ||
        event["process.name"].contains("semanage")
    actions:
    - type: audit
      message: "Security tool disruption command executed - active evasion detected"
{{- end }}

---
{{- if .Values.defaultPolicies.policies.suspiciousDNS }}
# Policy 8: Suspicious DNS Resolution Detection
# Detects DNS queries to known suspicious domains (C2 infrastructure)
# Maps to MITRE ATT&CK: T1071 (Application Layer Protocol), T1008 (Fallback Channels)
apiVersion: runtime.kyverno.io/v1alpha1
kind: RuntimePolicy
metadata:
  name: detect-suspicious-dns
  labels:
    app.kubernetes.io/name: kyverno-runtime
    app.kubernetes.io/component: default-policies
    app.kubernetes.io/version: "{{ .Chart.AppVersion }}"
    policy.kyverno.io/severity: warning
spec:
  validations:
  - name: c2-domain-resolution
    event: dns
    message: "DNS query to suspicious domain detected"
    severity: warning
    conditions:
    - name: suspicious-domain-pattern
      expression: |
        event["dns.query"].contains(".pastebin.com") ||
        event["dns.query"].contains(".github.io") ||
        event["dns.query"].contains(".ngrok.io") ||
        event["dns.query"].contains(".localtunnel.me") ||
        event["dns.query"].contains(".duckdns.org") ||
        event["dns.query"].contains(".herokuapp.com")
    actions:
    - type: audit
      message: "DNS query to suspicious domain - potential C2 communication"
{{- end }}

{{- end }}
