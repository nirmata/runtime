apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kyverno-runtime.fullname" . }}
  labels:
    {{- include "kyverno-runtime.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "kyverno-runtime.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        {{- include "kyverno-runtime.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: manager
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kyverno-runtime.serviceAccountName" . }}
      hostPID: true
      containers:
      - name: manager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          privileged: true
          runAsUser: 0
        args:
        {{- if .Values.leaderElection }}
        - --leader-elect
        {{- end }}
        - --inspektor-gadget-timeout={{ .Values.inspektorGadget.timeout }}
        - --report-buffer-interval={{ .Values.reportBuffer.interval }}
        - --report-buffer-max-count={{ .Values.reportBuffer.maxCount }}
        - --feature-baseline-engine={{ .Values.featureGates.baselineEngine }}
        - --feature-signature-engine={{ .Values.featureGates.signatureEngine }}
        - --feature-alert-sinks={{ .Values.featureGates.alertSinks }}
        - --feature-alert-aggregation={{ .Values.featureGates.alertAggregation }}
        env:
        - name: HOST_ROOT
          value: /host
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 8081
          name: probes
        volumeMounts:
        - name: host-root
          mountPath: /host
          readOnly: true
        - name: host-run
          mountPath: /run
        - name: host-var-run
          mountPath: /var/run
        - name: host-sys-fs-bpf
          mountPath: /sys/fs/bpf
        - name: host-sys-kernel-debug
          mountPath: /sys/kernel/debug
        - name: host-sys-kernel-tracing
          mountPath: /sys/kernel/tracing
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: host-root
        hostPath:
          path: /
          type: Directory
      - name: host-run
        hostPath:
          path: /run
          type: Directory
      - name: host-var-run
        hostPath:
          path: /var/run
          type: Directory
      - name: host-sys-fs-bpf
        hostPath:
          path: /sys/fs/bpf
          type: DirectoryOrCreate
      - name: host-sys-kernel-debug
        hostPath:
          path: /sys/kernel/debug
          type: DirectoryOrCreate
      - name: host-sys-kernel-tracing
        hostPath:
          path: /sys/kernel/tracing
          type: DirectoryOrCreate
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
