{{- $pushTLSDir := "/etc/kyverno-runtime/push-tls" }}
{{- if and .Values.daemon.push.target (not .Values.daemon.push.tls.secretName) }}
{{- fail "daemon.push.tls.secretName is required when daemon.push.target is set: the collector connection is mutual TLS" }}
{{- end }}
{{- if and .Values.daemon.events.enabled (not .Values.daemon.reports.enabled) }}
{{- fail "daemon.events.enabled requires daemon.reports.enabled: violation events are wired onto the reporter's flush" }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kyverno-runtime.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kyverno-runtime.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "kyverno-runtime.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: daemon
  {{- with .Values.daemon.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "kyverno-runtime.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: daemon
        {{- with .Values.daemon.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.daemon.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kyverno-runtime.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.daemon.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      hostPID: true
      containers:
      - name: daemon
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.daemon.securityContext | nindent 10 }}
        args:
        - daemon
        - --metrics-addr=:{{ .Values.daemon.metrics.port }}
        {{- with .Values.daemon.observeInterval }}
        - --observe-interval={{ . }}
        {{- end }}
        {{- with .Values.daemon.eventBufferSize }}
        - --event-buffer-size={{ . }}
        {{- end }}
        {{- with .Values.daemon.clusterDomain }}
        - --cluster-domain={{ . }}
        {{- end }}
        {{- with .Values.daemon.logLevel }}
        - --log-level={{ . }}
        {{- end }}
        {{- if not .Values.daemon.reports.enabled }}
        - --reports-enabled=false
        {{- end }}
        {{- if .Values.daemon.events.enabled }}
        - --events-enabled=true
        {{- end }}
        {{- with .Values.daemon.push.target }}
        - --push-target={{ . }}
        - --push-tls-ca={{ $pushTLSDir }}/ca.crt
        - --push-tls-cert={{ $pushTLSDir }}/tls.crt
        - --push-tls-key={{ $pushTLSDir }}/tls.key
        {{- end }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        ports:
        - name: metrics
          containerPort: {{ .Values.daemon.metrics.port }}
          protocol: TCP
        startupProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        resources:
          {{- toYaml .Values.daemon.resources | nindent 10 }}
        volumeMounts:
        - name: bpffs
          mountPath: /sys/fs/bpf
          mountPropagation: HostToContainer
        - name: securityfs
          mountPath: /sys/kernel/security
          readOnly: true
        {{- if .Values.daemon.push.target }}
        - name: push-tls
          mountPath: {{ $pushTLSDir }}
          readOnly: true
        {{- end }}
      volumes:
      # needed for BPF LSM map pinning
      - name: bpffs
        hostPath:
          path: /sys/fs/bpf
          type: Directory
      # the daemon reads the host's active LSM list to decide between BPF-LSM
      # and fmod_ret attachment; securityfs is not visible in containers
      - name: securityfs
        hostPath:
          path: /sys/kernel/security
          type: Directory
      {{- if .Values.daemon.push.target }}
      - name: push-tls
        secret:
          secretName: {{ .Values.daemon.push.tls.secretName }}
      {{- end }}
      {{- with .Values.daemon.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemon.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemon.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
