apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kyverno-runtime.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kyverno-runtime.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "kyverno-runtime.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: daemon
  {{- with .Values.daemon.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "kyverno-runtime.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: daemon
        {{- with .Values.daemon.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.daemon.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kyverno-runtime.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.daemon.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      hostPID: true
      containers:
      - name: daemon
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.daemon.securityContext | nindent 10 }}
        args:
        - daemon
        - --metrics-addr=:{{ .Values.daemon.metrics.port }}
        {{- with .Values.daemon.observeInterval }}
        - --observe-interval={{ . }}
        {{- end }}
        {{- with .Values.daemon.eventBufferSize }}
        - --event-buffer-size={{ . }}
        {{- end }}
        {{- with .Values.daemon.clusterDomain }}
        - --cluster-domain={{ . }}
        {{- end }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        ports:
        - name: metrics
          containerPort: {{ .Values.daemon.metrics.port }}
          protocol: TCP
        startupProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        resources:
          {{- toYaml .Values.daemon.resources | nindent 10 }}
      {{- with .Values.daemon.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemon.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemon.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
