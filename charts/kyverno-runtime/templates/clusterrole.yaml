{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kyverno-runtime.fullname" . }}
  labels:
    {{- include "kyverno-runtime.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/portforward"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch", "update"]
- apiGroups: ["runtime.kyverno.io"]
  resources: ["runtimepolicies", "runtimepolicies/status"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["runtime.kyverno.io"]
  resources: ["runtimebehaviors", "runtimebehaviors/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["openreports.io"]
  resources: ["reports"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
{{- end }}
