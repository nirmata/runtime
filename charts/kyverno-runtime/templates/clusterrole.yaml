{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kyverno-runtime.fullname" . }}
  labels:
    {{- include "kyverno-runtime.labels" . | nindent 4 }}
rules:
# daemon: watches pods on its node and runtime policies
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["runtime.kyverno.io"]
  resources: ["runtimepolicies"]
  verbs: ["get", "list", "watch"]
# ctrl: reconciles workload profiles and resolves daemon endpoints
- apiGroups: ["runtime.kyverno.io"]
  resources: ["workloadprofiles"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["runtime.kyverno.io"]
  resources: ["workloadprofiles/status", "workloadprofiles/finalizers"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
{{- if .Values.ctrl.leaderElection }}
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
{{- end }}
