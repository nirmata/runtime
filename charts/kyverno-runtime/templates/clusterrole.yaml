{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kyverno-runtime.fullname" . }}
  labels:
    {{- include "kyverno-runtime.labels" . | nindent 4 }}
rules:
# daemon: watches pods on its node and runtime policies
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["runtime.kyverno.io"]
  resources: ["runtimepolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["runtime.kyverno.io"]
  resources: ["runtimepolicies/status"]
  verbs: ["get", "update", "patch"]
# daemon: writes OpenReports for observed/violating behaviors (#29)
- apiGroups: ["openreports.io"]
  resources: ["reports", "clusterreports"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# daemon: shadow-AI discovery mode maintains the cluster-scoped AIInventory
# singleton. Any node's daemon may create it; each writes only its own shard in
# status.nodes, so status needs update/patch but the object itself never needs
# delete.
- apiGroups: ["runtime.kyverno.io"]
  resources: ["aiinventories"]
  verbs: ["get", "list", "watch", "create"]
- apiGroups: ["runtime.kyverno.io"]
  resources: ["aiinventories/status"]
  verbs: ["get", "update", "patch"]
# daemon: resolves the AIControls governance proxy endpoints so observed flows
# can be marked governed / ungoverned.
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
{{- with .Values.daemon.rbac.extraRules }}
# daemon: user-supplied extra rules, e.g. access to CRDs referenced by
# the resource library in policy expressions
{{- toYaml . | nindent 0 }}
{{- end }}
{{- end }}
