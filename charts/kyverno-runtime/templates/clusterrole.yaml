{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kyverno-runtime.fullname" . }}
  labels:
    {{- include "kyverno-runtime.labels" . | nindent 4 }}
rules:
# daemon: watches pods on its node and runtime policies
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
# daemon: reads namespace labels to match a policy's namespaceSelector
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
# daemon: watches node existence to prune status shards left by deleted nodes
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["runtime.nirmata.io"]
  resources: ["runtimepolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["runtime.nirmata.io"]
  resources: ["runtimepolicies/status"]
  verbs: ["get", "update", "patch"]
# daemon: resolves the Services a policy's network values name
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
{{- if .Values.daemon.reports.enabled }}
# daemon: writes OpenReports for observed/violating behaviors
- apiGroups: ["openreports.io"]
  resources: ["reports", "clusterreports"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
{{- if .Values.daemon.events.enabled }}
# daemon: emits Kubernetes Events for policy decisions and errors
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch"]
{{- end }}
{{- with .Values.daemon.rbac.extraRules }}
# daemon: user-supplied extra rules, e.g. access to CRDs referenced by
# the resource library in policy expressions
{{- toYaml . | nindent 0 }}
{{- end }}
{{- end }}
