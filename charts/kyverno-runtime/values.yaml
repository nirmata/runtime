image:
  repository: ghcr.io/nirmata/kyverno-runtime
  # tag defaults to the chart's appVersion when left empty
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

# daemon: runs the `kyverno-runtime daemon` command as a DaemonSet on every node
daemon:
  grpcBindAddress: ":9090"
  podLabels: {}
  podAnnotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  rbac:
    # extraRules: additional PolicyRule entries appended to the shared ClusterRole,
    # e.g. to grant the daemon read access to CRDs referenced by the resource library
    # in RuntimePolicy expressions. Ignored if rbac.create is false.
    # extraRules:
    # - apiGroups: ["example.io"]
    #   resources: ["widgets"]
    #   verbs: ["get", "list", "watch"]
    extraRules: []

# ctrl: runs the workload profile controller
ctrl:
  enabled: false
  replicas: 1
  leaderElection: true
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  # name/namespace of the Service fronting the daemon DaemonSet, used to resolve daemon endpoints
  daemonsetSvcName: "runtime-ds"
  daemonsetSvcNs: "kyverno-runtime"
  podLabels: {}
  podAnnotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
