image:
  repository: ghcr.io/nirmata/kyverno-runtime
  tag: prototype
  pullPolicy: IfNotPresent

leaderElection: true

inspektorGadget:
  timeout: 8s

reportBuffer:
  interval: 10s
  maxCount: 1000

featureGates:
  baselineEngine: false
  signatureEngine: false
  alertSinks: false
  alertAggregation: false

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

podLabels: {}
podAnnotations: {}
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
