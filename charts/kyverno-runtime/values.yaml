image:
  repository: ghcr.io/nirmata/kyverno-runtime
  # tag defaults to the chart's appVersion when left empty
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

# daemon: runs the `kyverno-runtime daemon` command as a DaemonSet on every node
daemon:
  grpcBindAddress: ":9090"
  podLabels: {}
  podAnnotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ctrl: runs the `kyverno-runtime ctrl` command as a Deployment, reconciling WorkloadProfiles
ctrl:
  replicas: 1
  leaderElection: true
  metricsBindAddress: ":8080"
  healthProbeBindAddress: ":8081"
  # name/namespace of the Service fronting the daemon DaemonSet, used to resolve daemon endpoints
  daemonsetSvcName: "runtime-ds"
  daemonsetSvcNs: "kyverno-runtime"
  podLabels: {}
  podAnnotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
