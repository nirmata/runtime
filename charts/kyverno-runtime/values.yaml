image:
  repository: ghcr.io/nirmata/kyverno-runtime
  # tag defaults to the chart's appVersion when left empty
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

# daemon: runs the `kyverno-runtime daemon` command as a DaemonSet on every node.
#
# The container always runs with securityContext.privileged: true. It loads and
# attaches BPF LSM, raw tracepoint, and cgroup_skb programs — tracing-class
# program load needs broad privilege on current kernels — and reads
# /proc/<pid>/cgroup across every process on the node via hostPID.
daemon:
  podLabels: {}
  podAnnotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  priorityClassName: system-node-critical
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # securityContext: the daemon container's securityContext. Defaults to what
  # attaching LSM and cgroup eBPF programs on the node currently requires.
  securityContext:
    capabilities:
      add:
      - BPF
      - PERFMON
      - NET_ADMIN
      - DAC_OVERRIDE
      - SYS_PTRACE
  # updateStrategy: passed through to the DaemonSet's spec.updateStrategy.
  # Empty uses the Kubernetes default (RollingUpdate).
  updateStrategy: {}
  metrics:
    # port the daemon serves /metrics and /healthz on, passed through --metrics-addr
    port: 9090
  # observeInterval: how often the BPF observation maps are drained. Bounds
  # monitor-mode detection latency. Empty uses the daemon default (10s).
  observeInterval: ""
  # eventBufferSize: depth of the collector's fan-in buffer. Events arriving when
  # it is full are dropped and counted. Empty uses the daemon default (4096).
  eventBufferSize: ""
  # clusterDomain: the cluster's DNS domain. It decides which network values are
  # in-cluster Service names, so a cluster not using the default rejects every
  # Service target until this matches. Empty uses the daemon default
  # (cluster.local).
  clusterDomain: ""
  # logLevel: verbosity for the daemon's debug logs (higher is more verbose).
  # Empty uses the daemon default (0).
  logLevel: ""
  # push: stream findings to a collector as they are produced. Empty target
  # disables it, and the daemon then opens no connection at all.
  push:
    # target: the collector's address, host:port.
    target: ""
    tls:
      # secretName: a Secret holding ca.crt (the collector's CA) plus tls.crt
      # and tls.key (this daemon's client certificate). Required when target is
      # set: the connection is mutual TLS, and there is no plaintext mode.
      secretName: ""
  # reports: write findings to namespaced OpenReports Report resources on every
  # flush. Disable for deployments that consume findings only through
  # push.target.
  reports:
    enabled: true
  # events: emit Kubernetes Events for policy violations (Warning), monitor-mode
  # would-violate findings (Normal), and policy apply errors (Warning). Off by
  # default: events add API-server write volume on busy clusters. Requires
  # reports.enabled.
  events:
    enabled: false
  rbac:
    # extraRules: additional PolicyRule entries appended to the shared ClusterRole,
    # e.g. to grant the daemon read access to CRDs referenced by the resource library
    # in RuntimePolicy expressions. Ignored if rbac.create is false.
    # extraRules:
    # - apiGroups: ["example.io"]
    #   resources: ["widgets"]
    #   verbs: ["get", "list", "watch"]
    extraRules: []
