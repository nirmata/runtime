  names:
    kind: RuntimeBehavior
    listKind: RuntimeBehaviorList
    plural: runtimebehaviors
    shortNames:
    - rbe
    singular: runtimebehavior
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
