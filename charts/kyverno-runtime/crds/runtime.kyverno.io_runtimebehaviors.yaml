      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RuntimeBehavior describes the known-good runtime profile for
          a workload.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RuntimeBehaviorSpec describes the known-good runtime profile
              for a workload.
            properties:
              allow:
                description: Allow defines inline allow rules and references to shared
                  defaults.
                properties:
                  deny:
                    description: Deny rules that always block behaviors, overriding
                      allow rules.
                    properties:
                      dns:
                        items:
                          type: string
                        type: array
                      exec:
                        items:
                          type: string
                        type: array
                      network:
                        items:
                          type: string
                        type: array
                      open:
                        items:
                          type: string
                        type: array
                    type: object
                  dns:
                    items:
                      type: string
                    type: array
                  exec:
                    description: Inline allow rules specific to this workload.
                    items:
                      type: string
                    type: array
                  network:
                    items:
                      type: string
                    type: array
                  open:
                    items:
                      type: string
                    type: array
                  refs:
                    description: Refs references other RuntimeBehavior resources that
                      serve as shared defaults.
                    items:
                      description: BehaviorReference references another RuntimeBehavior
                        resource.
                      properties:
                        name:
                          description: Name of the referenced RuntimeBehavior.
                          type: string
                        namespace:
                          description: |-
                            Namespace of the referenced RuntimeBehavior.
                            Defaults to the same namespace as the referrer.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                type: object
              learning:
                description: Learning configuration for auto-discovery of allowed
                  behaviors.
                properties:
                  duration:
                    description: Duration is how long to observe behaviors before
                      auto-promoting to monitor mode.
                    type: string
                  minSamples:
                    description: MinSamples is the minimum number of events to observe
